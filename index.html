<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GitHub Release 更新监控</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2128; --border:#30363d;
    --text:#e6edf3; --muted:#8b949e; --accent:#2f81f7;
    --green:#3fb950; --red:#f85149; --yellow:#d29922;
    --radius:12px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    line-height:1.6;
    -webkit-text-size-adjust:100%;
    -webkit-tap-highlight-color:transparent;
  }
  .app{max-width:1000px;margin:0 auto;padding:24px 16px calc(60px + env(safe-area-inset-bottom))}
  header h1{margin:0 0 4px;font-size:24px;line-height:1.25}
  header .sub{margin:0 0 20px;color:var(--muted);font-size:14px}

  .panel{
    background:var(--panel);border:1px solid var(--border);
    border-radius:var(--radius);padding:16px;margin-bottom:20px;
  }

  #repoInput{
    width:100%;min-height:64px;resize:vertical;padding:10px 12px;border-radius:8px;
    border:1px solid var(--border);background:#0d1117;color:var(--text);
    font-size:14px;outline:none;font-family:inherit;line-height:1.5;
  }
  #repoInput:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(47,129,247,.2)}

  .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
  .row button{flex:1 1 auto}

  button{
    padding:10px 16px;border-radius:8px;border:1px solid var(--border);
    background:var(--panel2);color:var(--text);font-size:14px;
    cursor:pointer;transition:.15s;font-family:inherit;
  }
  button:hover{background:#262c36;border-color:#484f58}
  button:disabled{opacity:.5;cursor:not-allowed}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.primary:hover{background:#1f6feb}
  button.danger:hover{background:#3d1418;border-color:var(--red);color:#ff7b72}
  button.small{font-size:12px;padding:7px 12px;border-radius:7px}

  .options{
    display:flex;gap:14px 18px;flex-wrap:wrap;align-items:center;
    margin-top:14px;font-size:13px;color:var(--muted);
  }
  .options label{display:flex;align-items:center;gap:6px;cursor:pointer}
  .options input[type=password]{
    padding:6px 9px;border-radius:6px;border:1px solid var(--border);
    background:#0d1117;color:var(--text);width:170px;font-size:13px;
    font-family:inherit;
  }
  .options select{
    padding:6px 8px;border-radius:6px;border:1px solid var(--border);
    background:#0d1117;color:var(--text);font-size:13px;font-family:inherit;
  }

  .sync-box{
    margin-top:14px;padding-top:14px;border-top:1px dashed var(--border);
    display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:13px;
  }
  .sync-box input{
    flex:1 1 240px;min-width:0;padding:8px 10px;border-radius:6px;
    border:1px solid var(--border);background:#0d1117;color:var(--text);
    font-size:13px;font-family:inherit;
  }
  .sync-box input:focus{outline:none;border-color:var(--accent)}
  #syncStatus{font-size:12px;color:var(--muted);white-space:nowrap}
  #syncStatus.ok{color:var(--green)}
  #syncStatus.err{color:var(--red)}
  #syncStatus.busy{color:var(--yellow)}

  .toolbar{
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    margin-top:14px;padding-top:14px;border-top:1px dashed var(--border);
    font-size:13px;color:var(--muted);
  }

  #list{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(min(100%, 320px), 1fr));
    gap:14px;
  }

  .card{
    position:relative;background:var(--panel);border:1px solid var(--border);
    border-radius:var(--radius);padding:14px 16px;transition:.18s;
    overflow-wrap:anywhere;
  }
  .card:hover{border-color:#484f58;transform:translateY(-1px)}
  .card.is-new{border-color:var(--green);box-shadow:0 0 0 1px rgba(63,185,80,.35),0 6px 22px -12px rgba(63,185,80,.6)}
  .card.is-new::before{
    content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;
    background:var(--green);border-radius:0 3px 3px 0;
  }
  .card.checking{opacity:.65}

  .card-head{
    display:flex;align-items:flex-start;justify-content:space-between;
    gap:10px;margin-bottom:10px;flex-wrap:wrap;
  }
  .repo-main{flex:1 1 auto;min-width:0}
  .repo-name{
    color:var(--accent);text-decoration:none;font-weight:600;font-size:15px;
    word-break:break-word;display:inline-block;max-width:100%;
  }
  .repo-name:hover{text-decoration:underline}

  /* ===== 中文备注 ===== */
  .repo-note{
    display:inline-block;max-width:100%;margin-top:3px;
    font-size:13px;font-weight:600;color:#e3b341;
    word-break:break-word;overflow-wrap:anywhere;
    cursor:pointer;
  }
  .repo-note:hover{text-decoration:underline}
  .note-editor{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;width:100%}
  .note-editor input{
    flex:1 1 100%;min-width:0;padding:7px 9px;border-radius:7px;
    border:1px solid var(--accent);background:#0d1117;color:var(--text);
    font-size:13px;font-family:inherit;outline:none;
  }
  .note-editor input:focus{box-shadow:0 0 0 3px rgba(47,129,247,.2)}

  .badge{font-size:11px;padding:2px 8px;border-radius:999px;white-space:nowrap;
         border:1px solid transparent;flex:0 0 auto}
  .badge.ok{background:rgba(63,185,80,.12);color:var(--green);border-color:rgba(63,185,80,.3)}
  .badge.new{background:rgba(63,185,80,.2);color:#56d364;border-color:var(--green);font-weight:700}
  .badge.warn{background:rgba(210,153,34,.15);color:var(--yellow);border-color:rgba(210,153,34,.4)}
  .badge.error{background:rgba(248,81,73,.12);color:#ff7b72;border-color:rgba(248,81,73,.3);
               max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .badge.loading{background:rgba(210,153,34,.12);color:var(--yellow);border-color:rgba(210,153,34,.3)}

  .version{
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:20px;font-weight:700;letter-spacing:.3px;margin-bottom:4px;
    word-break:break-word;overflow-wrap:anywhere;
  }
  .card.is-new .version{color:#56d364}
  .rel-name{font-size:12px;color:var(--muted);margin-bottom:4px;word-break:break-word}
  .meta{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
  .meta.hint{color:var(--yellow);margin-top:2px}

  details.assets{margin-top:10px;border:1px solid var(--border);border-radius:8px;background:#0d1117}
  details.assets>summary{
    cursor:pointer;padding:8px 11px;font-size:12px;color:var(--muted);
    list-style:none;user-select:none;
  }
  details.assets>summary::-webkit-details-marker{display:none}
  details.assets>summary::before{content:"▸ ";display:inline-block;transition:.15s}
  details.assets[open]>summary::before{transform:rotate(90deg)}
  details.assets ul{list-style:none;margin:0;padding:0 11px 9px;max-height:220px;overflow:auto}
  details.assets li{
    display:flex;justify-content:space-between;gap:10px;align-items:baseline;
    font-size:12px;padding:4px 0;border-top:1px dashed rgba(48,54,61,.7);
  }
  details.assets li:first-child{border-top:none}
  details.assets a{color:var(--accent);text-decoration:none;word-break:break-word;overflow-wrap:anywhere}
  details.assets a:hover{text-decoration:underline}
  details.assets .sz{color:var(--muted);white-space:nowrap;font-size:11px;flex:0 0 auto}

  .card-actions{
    display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;
    padding-top:12px;border-top:1px solid var(--border);
  }
  .card-actions button,.card-actions a{
    font-size:12px;padding:6px 11px;border-radius:7px;
  }
  .card-actions a{
    display:inline-block;text-decoration:none;color:var(--text);
    background:var(--panel2);border:1px solid var(--border);
  }
  .card-actions a:hover{background:#262c36;border-color:#484f58}

  .empty{
    text-align:center;color:var(--muted);padding:50px 20px;
    border:1px dashed var(--border);border-radius:var(--radius);font-size:14px;
  }
  .toast{
    position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);
    background:var(--panel2);border:1px solid var(--border);color:var(--text);
    padding:10px 18px;border-radius:8px;font-size:13px;opacity:0;
    transition:.25s;pointer-events:none;z-index:99;max-width:88vw;
    text-align:center;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .tip{font-size:12px;color:var(--muted);margin-top:10px}
  .tip code{background:#0d1117;padding:1px 5px;border-radius:4px;border:1px solid var(--border)}
  .tip b{color:var(--text)}

  /* ============ 平板及以下 ============ */
  @media (max-width: 720px){
    .app{padding:18px 12px 60px}
    header h1{font-size:21px}
    header .sub{font-size:13px;margin-bottom:16px}
    .panel{padding:14px;margin-bottom:16px}

    .options{gap:10px 14px}
    .options label{font-size:13px}
    .options input[type=password]{width:150px}

    #list{grid-template-columns:1fr;gap:12px}
    .card{padding:13px 14px}
    .version{font-size:19px}
  }

  /* ============ 手机 ============ */
  @media (max-width: 560px){
    .app{padding:14px 10px calc(50px + env(safe-area-inset-bottom))}
    header h1{font-size:19px}
    header .sub{font-size:12.5px;margin-bottom:14px}

    .panel{padding:12px;border-radius:10px;margin-bottom:14px}
    #repoInput{min-height:56px;font-size:15px;padding:10px}

    .row button{width:100%}

    /* 选项垂直排列，每个 label 占满一行 */
    .options{
      flex-direction:column;
      align-items:stretch;
      gap:10px;
      margin-top:12px;
    }
    .options label{
      justify-content:space-between;
      font-size:14px;
      padding:2px 0;
    }
    .options input[type=password]{
      width:60%;max-width:220px;
    }
    .options select{font-size:14px;padding:7px 9px}

    /* 同步区：输入框占满，按钮并排 */
    .sync-box{
      flex-direction:column;
      align-items:stretch;
      gap:8px;
    }
    .sync-box input{width:100%;flex:1 1 auto;padding:10px}
    .sync-box button.small{flex:1 1 auto;padding:10px 12px;font-size:13px}
    #syncStatus{white-space:normal;text-align:center;padding-top:2px}

    /* 工具栏按钮更大更好按 */
    .toolbar{
      gap:8px;
      padding-top:12px;
      margin-top:12px;
    }
    .toolbar button{
      flex:1 1 auto;
      padding:10px 12px;
      font-size:13.5px;
      min-width:120px;
    }
    .toolbar #rateInfo,
    .toolbar #lastRefresh{
      flex:1 1 100%;
      font-size:12px;
    }

    .card{padding:13px 13px 11px}
    .card-head{margin-bottom:8px}
    .repo-name{font-size:14.5px}
    .repo-note{font-size:13.5px}
    .note-editor input{font-size:15px;padding:9px 10px}
    .note-editor button{flex:1 1 auto;padding:9px 12px;font-size:13px}
    .badge{font-size:10.5px;padding:2px 7px}
    .badge.error{max-width:100%;white-space:normal}

    .version{font-size:18px;letter-spacing:.2px}

    /* 卡片操作按钮：等宽自适应，触摸区更大 */
    .card-actions{
      gap:6px;
      margin-top:12px;
      padding-top:10px;
    }
    .card-actions button,
    .card-actions a{
      flex:1 1 auto;
      min-width:0;
      text-align:center;
      padding:9px 8px;
      font-size:12.5px;
    }

    /* 下载文件列表在手机上堆叠 */
    details.assets li{
      flex-direction:column;
      align-items:flex-start;
      gap:2px;
    }
    details.assets .sz{font-size:10.5px}
    details.assets ul{max-height:260px}

    .tip{font-size:12px;line-height:1.55}
    .toast{left:14px;right:14px;transform:translateY(20px);max-width:none}
    .toast.show{transform:translateY(0)}
  }

  /* ============ 小屏手机（iPhone SE 等） ============ */
  @media (max-width: 380px){
    .app{padding:12px 8px 40px}
    header h1{font-size:18px}
    header .sub{font-size:12px}
    .panel{padding:10px}
    .card{padding:11px 11px 10px}
    .version{font-size:17px}
    .card-actions button,
    .card-actions a{padding:8px 6px;font-size:12px}
    .toolbar button{min-width:100px;font-size:13px}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>🔔 GitHub Release 更新监控</h1>
    <p class="sub">添加你关注的 PS5 插件仓库，自动检测新版本；数据可同步到你的私有 Gist，多设备共用</p>
  </header>

  <section class="panel">
    <form id="addForm" autocomplete="off">
      <textarea id="repoInput"
        placeholder="每行一个仓库，支持批量粘贴，可加中文备注：&#10;EchoStretch/kstuff | 金手指插件&#10;GoldHEN/GoldHEN | 自制系统&#10;https://github.com/owner/repo | 某个工具"></textarea>
      <div class="row">
        <button type="submit" class="primary">＋ 添加仓库</button>
      </div>
    </form>

    <div class="options">
      <label><input type="checkbox" id="includePrerelease"> 包含预发布版本</label>
      <label>自动刷新
        <select id="autoRefresh">
          <option value="0">关闭</option>
          <option value="10">每 10 分钟</option>
          <option value="30">每 30 分钟</option>
          <option value="60">每 1 小时</option>
          <option value="360">每 6 小时</option>
        </select>
      </label>
      <label>Token
        <input type="password" id="tokenInput" placeholder="ghp_xxx（需勾 gist）">
      </label>
    </div>

    <div class="sync-box">
      <input id="gistInput" placeholder="Gist ID（首次点右侧「创建」自动生成）">
      <button type="button" id="gistCreate" class="small">创建 / 绑定</button>
      <button type="button" id="gistPull" class="small">☁ 拉取</button>
      <button type="button" id="gistPush" class="small">⬆ 推送</button>
      <span id="syncStatus"></span>
    </div>

    <div class="toolbar">
      <button id="refreshAll">🔄 全部刷新</button>
      <button id="markAllRead">✓ 全部标记已读</button>
      <span id="rateInfo"></span>
      <span id="lastRefresh"></span>
    </div>

    <div class="tip">
      <b>备注：</b>添加仓库时可写成 <code>owner/repo | 中文备注</code>，
      也可以随时点卡片上的「📝 备注」或直接点备注文字来修改。备注会一起云同步。<br>
      <b>Token：</b>需勾选 <code>gist</code> 权限（classic token 即可），它同时用于 GitHub API 和云同步。
      填入 Token 后 API 额度从 <code>60 次/小时</code> 提升到 <code>5000 次/小时</code>。
      Token 与 Gist ID 只保存在各设备浏览器本地，不会进入代码。
    </div>
  </section>

  <main id="list"></main>
  <div id="empty" class="empty">还没有关注的仓库，添加一个试试～</div>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  'use strict';

  const STORAGE_KEY = 'gh-release-watcher-v1';
  const GIST_FILE   = 'gh-release-watcher.json';
  const NOTE_MAX    = 40;

  const state = {
    repos: [],
    token: '',
    gistId: '',
    updatedAt: 0,
    includePrerelease: false,
    autoRefreshMinutes: 0,
    rate: null,
    editingNote: null      // 正在编辑备注的仓库 fullName
  };

  /* ---------------- 本地持久化 ---------------- */

  function load(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return;
      const d = JSON.parse(raw);
      state.repos = (d.repos || []).map(r => ({
        fullName: r.fullName,
        note: r.note || '',
        lastSeenTag: r.lastSeenTag ?? null,
        latest: r.latest || null,
        error: null,
        lastCheck: r.lastCheck || null,
        isNew: false,
        isRollback: false,
        checking: false
      }));
      state.token = d.token || '';
      state.gistId = d.gistId || '';
      state.updatedAt = d.updatedAt || 0;
      state.includePrerelease = !!d.includePrerelease;
      state.autoRefreshMinutes = d.autoRefreshMinutes || 0;
    }catch(e){ console.warn('读取本地数据失败', e); }
  }

  function save(opts){
    opts = opts || {};
    if(opts.touch !== false) state.updatedAt = Date.now();

    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        repos: state.repos.map(r => ({
          fullName: r.fullName,
          note: r.note || '',
          lastSeenTag: r.lastSeenTag,
          latest: r.latest,
          lastCheck: r.lastCheck
        })),
        token: state.token,
        gistId: state.gistId,
        updatedAt: state.updatedAt,
        includePrerelease: state.includePrerelease,
        autoRefreshMinutes: state.autoRefreshMinutes
      }));
    }catch(e){ console.warn('保存失败', e); }

    if(opts.push !== false) schedulePush();
  }

  /* ---------------- 工具函数 ---------------- */

  function esc(s){
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  /* 解析单条输入，返回 { fullName, note } 或 null
     支持：owner/repo | 中文备注
           https://github.com/owner/repo | 中文备注  */
  function parseRepo(input){
    if(!input) return null;
    let s = String(input).trim();
    if(!s) return null;

    let note = '';
    const i = s.search(/[|｜]/);
    if(i >= 0){
      note = s.slice(i + 1).trim();
      s = s.slice(0, i).trim();
      if(!s) return null;
    }

    let m = s.match(/github\.com[/:]([^/\s?#]+)\/([^/\s?#]+)/i);
    if(m) return { fullName: (m[1] + '/' + m[2]).replace(/\.git$/i,''), note };

    m = s.match(/^([A-Za-z0-9_.-]+)\/([A-Za-z0-9_.-]+)$/);
    if(m) return { fullName: m[1] + '/' + m[2].replace(/\.git$/i,''), note };

    return null;
  }

  function relTime(ts){
    const diff = Date.now() - ts;
    if(diff < 60000) return '刚刚';
    const m = Math.floor(diff / 60000);
    if(m < 60) return m + ' 分钟前';
    const h = Math.floor(m / 60);
    if(h < 24) return h + ' 小时前';
    return Math.floor(h / 24) + ' 天前';
  }

  function fmtDate(iso){
    const d = new Date(iso);
    if(isNaN(d)) return '';
    const p = n => String(n).padStart(2,'0');
    return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
  }

  function fmtSize(n){
    if(typeof n !== 'number' || isNaN(n)) return '';
    if(n < 1024) return n + ' B';
    const u = ['KB','MB','GB'];
    let i = -1;
    do { n /= 1024; i++; } while(n >= 1024 && i < u.length - 1);
    return n.toFixed(n >= 100 ? 0 : 1) + ' ' + u[i];
  }

  function nowTime(){
    return new Date().toLocaleTimeString('zh-CN', {hour12:false});
  }

  /* ---- 版本号比较 ---- */

  function parseVersion(tag){
    const s = String(tag == null ? '' : tag).trim().replace(/^[vV]\s*/, '');
    const m = s.match(/^(\d+(?:\.\d+)*)(.*)$/);
    if(!m) return null;
    return {
      nums: m[1].split('.').map(Number),
      pre: m[2].replace(/^[-_.+\s]+/, '').toLowerCase()
    };
  }

  function compareVersions(a, b){
    if(a === b) return 0;
    const A = parseVersion(a), B = parseVersion(b);
    if(!A || !B) return String(a) > String(b) ? 1 : -1;
    const n = Math.max(A.nums.length, B.nums.length);
    for(let i = 0; i < n; i++){
      const x = A.nums[i] || 0, y = B.nums[i] || 0;
      if(x !== y) return x > y ? 1 : -1;
    }
    if(A.pre === B.pre) return 0;
    if(!A.pre) return 1;
    if(!B.pre) return -1;
    return A.pre > B.pre ? 1 : -1;
  }

  let toastTimer = null;
  function toast(msg){
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2400);
  }

  /* ---------------- GitHub API ---------------- */

  function cleanHeaderValue(v){
    return String(v == null ? '' : v).replace(/[^\x20-\x7E\x80-\xFF]/g, '');
  }

  async function ghFetch(path, init){
    const headers = Object.assign(
      { 'Accept': 'application/vnd.github+json' },
      (init && init.headers) || {}
    );
    if(state.token) headers['Authorization'] = 'Bearer ' + state.token.trim();

    Object.keys(headers).forEach(k => {
      headers[k] = cleanHeaderValue(headers[k]);
    });

    const res = await fetch('https://api.github.com' + path,
      Object.assign({}, init, { headers }));

    const rem = res.headers.get('x-ratelimit-remaining');
    if(rem !== null){
      state.rate = {
        remaining: Number(rem),
        limit: Number(res.headers.get('x-ratelimit-limit')),
        reset: Number(res.headers.get('x-ratelimit-reset'))
      };
      renderRate();
    }
    return res;
  }

  function rateMsg(res){
    const reset = res.headers.get('x-ratelimit-reset');
    if(reset){
      const t = new Date(Number(reset) * 1000);
      const p = n => String(n).padStart(2,'0');
      return `API 额度用尽，${p(t.getHours())}:${p(t.getMinutes())} 后重置`;
    }
    return 'API 访问被拒绝（可能是额度用尽）';
  }

  function isRateLimited(res){ return res.status === 403 || res.status === 429; }

  function pseudoReleaseFromTag(repo, tagName){
    return {
      tag_name: tagName,
      name: tagName,
      html_url: `https://github.com/${repo.fullName}/releases/tag/${encodeURIComponent(tagName)}`,
      published_at: null,
      prerelease: false,
      assets: []
    };
  }

  function normalizeRelease(release){
    return {
      tag: release.tag_name,
      name: release.name || release.tag_name,
      url: release.html_url || '#',
      publishedAt: release.published_at || null,
      prerelease: !!release.prerelease,
      assets: (release.assets || []).map(a => ({
        name: a.name, size: a.size, url: a.browser_download_url
      }))
    };
  }

  async function fetchLatestRelease(repo){
    if(state.includePrerelease){
      const res = await ghFetch(`/repos/${repo.fullName}/releases?per_page=1`);
      if(isRateLimited(res)) throw new Error(rateMsg(res));
      if(res.status === 404) throw new Error('仓库不存在或不可访问');
      if(!res.ok) throw new Error('HTTP ' + res.status);
      const arr = await res.json();
      if(arr.length) return arr[0];
    }else{
      const res = await ghFetch(`/repos/${repo.fullName}/releases/latest`);
      if(isRateLimited(res)) throw new Error(rateMsg(res));
      if(res.ok) return await res.json();
      if(res.status !== 404) throw new Error('HTTP ' + res.status);
    }

    const rt = await ghFetch(`/repos/${repo.fullName}/tags?per_page=1`);
    if(isRateLimited(rt)) throw new Error(rateMsg(rt));
    if(rt.status === 404) throw new Error('仓库不存在或不可访问');
    if(!rt.ok) throw new Error('HTTP ' + rt.status);
    const tags = await rt.json();
    if(tags.length) return pseudoReleaseFromTag(repo, tags[0].name);
    return null;
  }

  async function checkRepo(repo){
    if(repo.checking) return;
    repo.checking = true;
    repo.error = null;
    render();

    try{
      const release = await fetchLatestRelease(repo);
      repo.lastCheck = Date.now();

      if(release){
        repo.latest = normalizeRelease(release);
        const tag = repo.latest.tag;

        if(repo.lastSeenTag == null){
          repo.lastSeenTag = tag;
          repo.isNew = false;
          repo.isRollback = false;
        }else{
          const c = compareVersions(tag, repo.lastSeenTag);
          repo.isNew = c > 0;
          repo.isRollback = c < 0;
          if(c !== 0) repo.lastSeenTag = tag;
        }
        repo.error = null;
      }else{
        repo.latest = null;
        repo.isNew = false;
        repo.isRollback = false;
        repo.error = '没有找到 Release 或 Tag';
      }
    }catch(e){
      repo.lastCheck = Date.now();
      repo.error = e.message || '请求失败';
    }finally{
      repo.checking = false;
      save();
      render();
      updateTitle();
    }
  }

  let refreshing = false;
  async function refreshAll(){
    if(refreshing || !state.repos.length) return;
    refreshing = true;
    const btn = document.getElementById('refreshAll');
    btn.disabled = true;
    btn.textContent = '⏳ 刷新中…';
    await Promise.all(state.repos.map(r => checkRepo(r)));
    refreshing = false;
    btn.disabled = false;
    btn.textContent = '🔄 全部刷新';
    document.getElementById('lastRefresh').textContent =
      '最后刷新：' + nowTime();
    save();
    updateTitle();
  }

  /* ---------------- 云同步（私有 Gist） ---------------- */

  const sync = {
    busy: false,
    pushTimer: null,
    lastAt: null
  };

  function syncReady(){
    return !!(state.gistId && state.token);
  }

  function setSyncStatus(kind, text){
    const el = document.getElementById('syncStatus');
    el.className = kind ? kind : '';
    el.textContent = text || '';
  }

  function cloudPayload(){
    return JSON.stringify({
      version: 1,
      updatedAt: state.updatedAt || 0,
      savedAt: new Date().toISOString(),
      repos: state.repos.map(r => ({
        fullName: r.fullName,
        note: r.note || '',
        lastSeenTag: r.lastSeenTag,
        latest: r.latest,
        lastCheck: r.lastCheck
      }))
    }, null, 2);
  }

  function applyRemote(remote){
    state.repos = (remote.repos || []).map(r => ({
      fullName: r.fullName,
      note: r.note || '',
      lastSeenTag: r.lastSeenTag ?? null,
      latest: r.latest || null,
      error: null,
      lastCheck: r.lastCheck || null,
      isNew: false,
      isRollback: false,
      checking: false
    }));
    state.updatedAt = remote.updatedAt || 0;
    state.editingNote = null;
  }

  async function cloudPull(silent){
    if(!syncReady()){
      if(!silent) toast('请先填写 Token 并创建/绑定 Gist');
      return { ok:false, error:'未配置同步' };
    }
    if(sync.busy) return { ok:false, error:'正在同步中' };
    sync.busy = true;
    setSyncStatus('busy', '⏳ 拉取中…');

    try{
      const res = await ghFetch('/gists/' + state.gistId);
      if(res.status === 404) throw new Error('Gist 不存在或 Token 无权限');
      if(!res.ok) throw new Error('HTTP ' + res.status);

      const data = await res.json();
      const file = data.files && data.files[GIST_FILE];
      if(!file || !file.content){
        setSyncStatus('ok', '✓ 云端为空，已就绪');
        sync.lastAt = Date.now();
        return { ok:true, applied:false };
      }

      let remote;
      try{ remote = JSON.parse(file.content); }
      catch(e){ throw new Error('云端数据格式异常'); }

      const remoteRepos = remote.repos || [];
      const localRepos = state.repos || [];
      const remoteAt = remote.updatedAt || 0;
      const localAt = state.updatedAt || 0;

      // 云端为空但本地有数据：绝不覆盖本地，改为把本地推上去
      if(remoteRepos.length === 0 && localRepos.length > 0){
        setSyncStatus('busy', '⏳ 云端为空，正在上传本地数据…');
        try{
          const pr = await ghFetch('/gists/' + state.gistId, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              files: { [GIST_FILE]: { content: cloudPayload() } }
            })
          });
          if(!pr.ok) throw new Error('HTTP ' + pr.status);
          setSyncStatus('ok', '✓ 云端为空，已上传本地 ' + nowTime());
          sync.lastAt = Date.now();
          return { ok:true, applied:false, restored:true };
        }catch(e){
          setSyncStatus('err', '⚠ 上传失败：' + (e.message || ''));
          return { ok:false, error: e.message || '上传失败' };
        }
      }

      if(remoteAt > localAt){
        applyRemote(remote);
        save({ touch:false, push:false });
        render();
        updateTitle();
        setSyncStatus('ok', '✓ 已从云端更新 ' + nowTime());
        sync.lastAt = Date.now();
        return { ok:true, applied:true };
      }

      setSyncStatus('ok', '✓ 本地已是最新 ' + nowTime());
      sync.lastAt = Date.now();
      return { ok:true, applied:false };
    }catch(e){
      setSyncStatus('err', '⚠ ' + (e.message || '拉取失败'));
      if(!silent) toast('拉取失败：' + (e.message || ''));
      return { ok:false, error: e.message || '拉取失败' };
    }finally{
      sync.busy = false;
    }
  }

  async function cloudPush(silent){
    if(!syncReady()){
      if(!silent) toast('请先填写 Token 并创建/绑定 Gist');
      return { ok:false, error:'未配置同步' };
    }
    if(sync.busy) return { ok:false, error:'正在同步中' };
    sync.busy = true;
    setSyncStatus('busy', '⏳ 推送中…');

    try{
      const res = await ghFetch('/gists/' + state.gistId, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          files: { [GIST_FILE]: { content: cloudPayload() } }
        })
      });
      if(res.status === 404) throw new Error('Gist 不存在或 Token 无权限');
      if(res.status === 401) throw new Error('Token 无效或缺少 gist 权限');
      if(!res.ok) throw new Error('HTTP ' + res.status);

      setSyncStatus('ok', '✓ 已同步 ' + nowTime());
      sync.lastAt = Date.now();
      return { ok:true };
    }catch(e){
      setSyncStatus('err', '⚠ ' + (e.message || '推送失败'));
      if(!silent) toast('推送失败：' + (e.message || ''));
      return { ok:false, error: e.message || '推送失败' };
    }finally{
      sync.busy = false;
    }
  }

  function schedulePush(){
    if(!syncReady()) return;
    clearTimeout(sync.pushTimer);
    setSyncStatus('busy', '⏳ 待同步…');
    sync.pushTimer = setTimeout(() => cloudPush(true), 2500);
  }

  function ensureCloudHasData(){
    if(!syncReady()) return;
    if(state.repos.length > 0 && (state.updatedAt || 0) > 0){
      cloudPush(true);
    }
  }

  async function createGist(){
    if(!state.token){
      toast('请先填写带 gist 权限的 Token');
      return;
    }
    if(state.gistId && !confirm('已绑定 Gist，重新创建会生成一个新的，确定继续？')) return;

    setSyncStatus('busy', '⏳ 创建中…');
    try{
      const res = await ghFetch('/gists', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          description: 'GitHub Release Watcher 同步数据',
          public: false,
          files: { [GIST_FILE]: { content: cloudPayload() } }
        })
      });
      if(res.status === 401) throw new Error('Token 无效或缺少 gist 权限');
      if(!res.ok) throw new Error('HTTP ' + res.status);

      const data = await res.json();
      state.gistId = data.id;
      document.getElementById('gistInput').value = data.id;
      save({ touch:false });
      setSyncStatus('ok', '✓ 已创建 ' + data.id.slice(0,8) + '…');
      toast('私有 Gist 已创建，其他设备填这个 ID + 同一个 Token 即可同步');
    }catch(e){
      setSyncStatus('err', '⚠ ' + (e.message || '创建失败'));
      toast('创建失败：' + (e.message || ''));
    }
  }

  /* ---------------- 备注编辑 ---------------- */

  function commitNote(editorEl){
    if(!editorEl) return;
    const fullName = editorEl.dataset.repo;
    const repo = state.repos.find(r => r.fullName === fullName);
    if(!repo) return;
    const inp = editorEl.querySelector('.note-input');
    const val = String(inp ? inp.value : '').trim().slice(0, NOTE_MAX);

    repo.note = val;
    state.editingNote = null;
    save();
    render();
    toast(val ? '备注已保存' : '备注已清除');
  }

  /* ---------------- 渲染 ---------------- */

  function renderRate(){
    const el = document.getElementById('rateInfo');
    if(state.rate && !isNaN(state.rate.remaining)){
      el.textContent = `API 剩余额度：${state.rate.remaining}/${state.rate.limit}`;
      el.style.color = state.rate.remaining < 10 ? 'var(--red)' : '';
    }else{
      el.textContent = '';
    }
  }

  function cardHtml(repo){
    const latest = repo.latest;
    let badge;

    if(repo.checking){
      badge = '<span class="badge loading">检查中…</span>';
    }else if(repo.error){
      badge = `<span class="badge error" title="${esc(repo.error)}">⚠ ${esc(repo.error)}</span>`;
    }else if(repo.isNew){
      badge = '<span class="badge new">🎉 有新版本</span>';
    }else if(repo.isRollback){
      badge = '<span class="badge warn">↩ 版本回退</span>';
    }else if(latest){
      badge = '<span class="badge ok">✓ 已是最新</span>';
    }else{
      badge = '<span class="badge">—</span>';
    }

    /* --- 备注区 --- */
    let noteHtml = '';
    if(state.editingNote === repo.fullName){
      noteHtml = `<div class="note-editor" data-repo="${esc(repo.fullName)}">
          <input class="note-input" type="text" maxlength="${NOTE_MAX}"
                 placeholder="输入中文备注，如：金手指 / 存档工具"
                 value="${esc(repo.note || '')}">
          <button class="primary small" data-action="note-save" data-repo="${esc(repo.fullName)}">保存</button>
          <button class="small" data-action="note-cancel" data-repo="${esc(repo.fullName)}">取消</button>
        </div>`;
    }else if(repo.note){
      noteHtml = `<div class="repo-note" data-repo="${esc(repo.fullName)}"
                       title="点击修改备注">${esc(repo.note)}</div>`;
    }

    const version = latest ? esc(latest.tag) : '—';
    const relName = (latest && latest.name && latest.name !== latest.tag)
      ? `<div class="rel-name">${esc(latest.name)}</div>` : '';

    const metaParts = [];
    if(latest && latest.publishedAt) metaParts.push('发布：' + fmtDate(latest.publishedAt));
    if(latest && latest.prerelease) metaParts.push('预发布');
    metaParts.push('检查：' + (repo.lastCheck ? relTime(repo.lastCheck) : '未检查'));
    const meta = metaParts.join(' · ');

    const hint = (repo.lastSeenTag && (repo.isNew || repo.isRollback))
      ? `<div class="meta hint">记录中的版本：${esc(repo.lastSeenTag)}</div>` : '';

    const assets = (latest && latest.assets && latest.assets.length)
      ? `<details class="assets">
           <summary>📦 ${latest.assets.length} 个下载文件</summary>
           <ul>${latest.assets.map(a =>
             `<li><a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.name)}</a>` +
             `<span class="sz">${fmtSize(a.size)}</span></li>`).join('')}</ul>
         </details>`
      : '';

    return `
      <div class="card${repo.isNew ? ' is-new' : ''}${repo.checking ? ' checking' : ''}">
        <div class="card-head">
          <div class="repo-main">
            <a class="repo-name" href="https://github.com/${esc(repo.fullName)}"
               target="_blank" rel="noopener">${esc(repo.fullName)}</a>
            ${noteHtml}
          </div>
          ${badge}
        </div>
        <div class="version">${version}</div>
        ${relName}
        <div class="meta">${esc(meta)}</div>
        ${hint}
        ${assets}
        <div class="card-actions">
          ${latest && latest.url && latest.url !== '#' ? `<a href="${esc(latest.url)}" target="_blank" rel="noopener">查看 Release</a>` : ''}
          ${repo.isNew ? `<button class="primary" data-action="read" data-repo="${esc(repo.fullName)}">标记已读</button>` : ''}
          <button data-action="note" data-repo="${esc(repo.fullName)}">📝 ${repo.note ? '改备注' : '备注'}</button>
          <button data-action="check" data-repo="${esc(repo.fullName)}">刷新</button>
          <button class="danger" data-action="remove" data-repo="${esc(repo.fullName)}">删除</button>
        </div>
      </div>`;
  }

  function render(){
    const list = document.getElementById('list');
    const empty = document.getElementById('empty');
    empty.style.display = state.repos.length ? 'none' : 'block';
    list.innerHTML = state.repos.map(cardHtml).join('');

    // 编辑态：自动聚焦备注输入框
    if(state.editingNote){
      const inp = list.querySelector('.note-input');
      if(inp){ try{ inp.focus(); }catch(e){} }
    }
  }

  function updateTitle(){
    const n = state.repos.filter(r => r.isNew).length;
    document.title = (n ? `(${n}) ` : '') + 'GitHub Release 更新监控';
  }

  /* ---------------- 交互 ---------------- */

  document.getElementById('addForm').addEventListener('submit', function(e){
    e.preventDefault();
    const input = document.getElementById('repoInput');
    const raw = input.value;

    // 按行拆分：含 “|” 的行整行解析（可带备注），其余行再按空白/逗号拆
    const candidates = [];
    String(raw).split(/\r?\n/).forEach(line => {
      const l = line.trim();
      if(!l) return;
      if(/[|｜]/.test(l)){
        candidates.push(l);
      }else{
        l.split(/[\s,;，；、]+/).filter(Boolean).forEach(t => candidates.push(t));
      }
    });

    const parsed = [];
    let invalid = 0;
    let noteUpdated = 0;

    candidates.forEach(t => {
      const p = parseRepo(t);
      if(!p){ invalid++; return; }

      const exist = state.repos.find(
        r => r.fullName.toLowerCase() === p.fullName.toLowerCase()
      );
      if(exist){
        // 已存在：如果这次带了备注，就顺手更新
        if(p.note && p.note !== exist.note){
          exist.note = p.note.slice(0, NOTE_MAX);
          noteUpdated++;
        }
        return;
      }
      if(parsed.some(x => x.fullName.toLowerCase() === p.fullName.toLowerCase())) return;
      parsed.push(p);
    });

    if(!parsed.length){
      if(noteUpdated){
        input.value = '';
        save(); render();
        toast(`已更新 ${noteUpdated} 个仓库的备注`);
        return;
      }
      toast(invalid ? '格式不对，请输入 owner/repo 或完整 GitHub 链接' : '这些仓库都已经在列表里了');
      return;
    }

    const newRepos = parsed.map(p => ({
      fullName: p.fullName,
      note: (p.note || '').slice(0, NOTE_MAX),
      lastSeenTag: null, latest: null,
      error: null, lastCheck: null, checking: false,
      isNew: false, isRollback: false
    }));

    state.repos = newRepos.concat(state.repos);
    input.value = '';
    save();
    render();

    toast(`已添加 ${newRepos.length} 个仓库${invalid ? `，忽略 ${invalid} 条无效输入` : ''}`);
    newRepos.forEach(r => checkRepo(r));
  });

  const listEl = document.getElementById('list');

  listEl.addEventListener('click', async function(e){
    // 点击备注文字 -> 进入编辑
    const noteEl = e.target.closest('.repo-note');
    if(noteEl && noteEl.dataset.repo){
      state.editingNote = noteEl.dataset.repo;
      render();
      return;
    }

    const btn = e.target.closest('button[data-action]');
    if(!btn) return;
    const repo = state.repos.find(r => r.fullName === btn.dataset.repo);
    if(!repo) return;

    const action = btn.dataset.action;

    if(action === 'check'){
      await checkRepo(repo);
      document.getElementById('lastRefresh').textContent = '最后刷新：' + nowTime();
    }else if(action === 'remove'){
      state.repos = state.repos.filter(r => r !== repo);
      if(state.editingNote === repo.fullName) state.editingNote = null;
      save(); render(); updateTitle();
      toast('已删除 ' + repo.fullName);
    }else if(action === 'read'){
      repo.isNew = false;
      repo.isRollback = false;
      if(repo.latest) repo.lastSeenTag = repo.latest.tag;
      save(); render(); updateTitle();
    }else if(action === 'note'){
      state.editingNote = (state.editingNote === repo.fullName) ? null : repo.fullName;
      render();
    }else if(action === 'note-save'){
      commitNote(btn.closest('.note-editor'));
    }else if(action === 'note-cancel'){
      state.editingNote = null;
      render();
    }
  });

  // 备注输入框键盘操作：Enter 保存，Esc 取消
  listEl.addEventListener('keydown', function(e){
    const inp = e.target;
    if(!inp.classList || !inp.classList.contains('note-input')) return;
    if(e.key === 'Enter'){
      e.preventDefault();
      commitNote(inp.closest('.note-editor'));
    }else if(e.key === 'Escape'){
      e.preventDefault();
      state.editingNote = null;
      render();
    }
  });

  document.getElementById('refreshAll').addEventListener('click', refreshAll);

  document.getElementById('markAllRead').addEventListener('click', function(){
    let n = 0;
    state.repos.forEach(r => {
      if(r.isNew){
        r.isNew = false;
        r.isRollback = false;
        if(r.latest) r.lastSeenTag = r.latest.tag;
        n++;
      }
    });
    save(); render(); updateTitle();
    toast(n ? `已标记 ${n} 个仓库为已读` : '没有未读的新版本');
  });

  document.getElementById('includePrerelease').addEventListener('change', function(){
    state.includePrerelease = this.checked;
    state.repos.forEach(r => {
      r.lastSeenTag = null; r.isNew = false; r.isRollback = false;
    });
    save();
    if(state.repos.length) refreshAll();
    toast(this.checked ? '已包含预发布版本（基线已重置）' : '已只看正式版本（基线已重置）');
  });

  document.getElementById('autoRefresh').addEventListener('change', function(){
    state.autoRefreshMinutes = Number(this.value) || 0;
    save();
    setupTimer();
    toast(state.autoRefreshMinutes ? `已开启自动刷新：每 ${state.autoRefreshMinutes} 分钟` : '已关闭自动刷新');
  });

  document.getElementById('tokenInput').addEventListener('change', function(){
    let t = this.value.trim().replace(/[^\x21-\x7E]/g, '');
    this.value = t;
    state.token = t;
    save();
    if(t && !/^gh[pousr]_/.test(t)){
      toast('Token 格式看起来不对，应以 ghp_ 开头');
    }else{
      toast(t ? 'Token 已保存' : 'Token 已清空');
    }
    if(state.repos.length) refreshAll();
  });

  document.getElementById('gistInput').addEventListener('change', function(){
    state.gistId = this.value.trim();
    save({ touch:false });
    setSyncStatus('', state.gistId ? '已绑定 ' + state.gistId.slice(0,8) + '…' : '');
  });

  document.getElementById('gistCreate').addEventListener('click', createGist);
  document.getElementById('gistPull').addEventListener('click', () => cloudPull(false));

  document.getElementById('gistPush').addEventListener('click', () => {
    if(!state.repos.length && state.gistId){
      if(!confirm('本地列表为空，推送会用空数据覆盖云端，确定继续？')) return;
    }
    cloudPush(false);
  });

  /* ---------------- 定时器 ---------------- */

  let timer = null;
  function setupTimer(){
    clearInterval(timer);
    if(state.autoRefreshMinutes > 0){
      timer = setInterval(refreshAll, state.autoRefreshMinutes * 60000);
    }
  }

  /* ---------------- URL 快速配置 ---------------- */

  function applyUrlConfig(){
    const h = location.hash.replace(/^#/, '');
    if(!h) return;
    let p;
    try{ p = new URLSearchParams(h); }catch(e){ return; }
    const g = p.get('gist'), t = p.get('token');
    if(g) state.gistId = g;
    if(t) state.token = t.replace(/[^\x21-\x7E]/g, '');
    if(g || t){
      try{ history.replaceState(null, '', location.pathname + location.search); }catch(e){}
      save({ touch:false, push:false });
    }
  }

  /* ---------------- 启动 ---------------- */

  async function init(){
    load();
    applyUrlConfig();

    document.getElementById('includePrerelease').checked = state.includePrerelease;
    document.getElementById('autoRefresh').value = String(state.autoRefreshMinutes);
    document.getElementById('tokenInput').value = state.token;
    document.getElementById('gistInput').value = state.gistId;

    render();
    updateTitle();
    setupTimer();

    if(state.gistId && state.token){
      setSyncStatus('busy', '⏳ 正在拉取云端数据…');
      const r = await cloudPull(true);
      if(!r.ok) setSyncStatus('err', '⚠ ' + (r.error || '拉取失败'));
      render(); updateTitle();
    }else if(state.gistId && !state.token){
      setSyncStatus('', '已绑定 Gist，填入 Token 后自动同步');
    }

    ensureCloudHasData();

    if(state.repos.length){
      setTimeout(refreshAll, 300);
    }
  }

  init();
})();
</script>
</body>
</html>
