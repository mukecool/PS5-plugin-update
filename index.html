<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GitHub Release 更新监控</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2128; --border:#30363d;
    --text:#e6edf3; --muted:#8b949e; --accent:#2f81f7;
    --green:#3fb950; --red:#f85149; --yellow:#d29922;
    --purple:#a371f7;
    --radius:12px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    line-height:1.6;
    -webkit-text-size-adjust:100%;
    -webkit-tap-highlight-color:transparent;
  }
  .app{max-width:1100px;margin:0 auto;padding:16px 16px calc(50px + env(safe-area-inset-bottom))}

  /* ============ 顶部精简栏 ============ */
  .topbar{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    margin-bottom:14px;
  }
  .topbar .brand{
    font-size:16px;font-weight:700;
    display:flex;align-items:center;gap:7px;
    flex:1 1 auto;min-width:0;
    white-space:nowrap;
  }
  .topbar .brand .new-badge{
    background:var(--green);color:#0d1117;
    font-size:11px;font-weight:800;
    padding:1px 8px;border-radius:999px;
    letter-spacing:.2px;
  }
  .topbar .tools{
    display:flex;gap:7px;flex-wrap:wrap;
  }
  .tool-btn{
    display:inline-flex;align-items:center;gap:5px;
    padding:8px 13px;border-radius:9px;
    border:1px solid var(--border);background:var(--panel);
    color:var(--text);font-size:13px;font-family:inherit;
    cursor:pointer;transition:.15s;white-space:nowrap;
  }
  .tool-btn:hover{background:#262c36;border-color:#484f58}
  .tool-btn.active{
    background:rgba(47,129,247,.15);
    border-color:var(--accent);color:#79c0ff;
  }
  .tool-btn.primary{
    background:var(--accent);border-color:var(--accent);color:#fff;
  }
  .tool-btn.primary:hover{background:#1f6feb}
  .tool-btn .ic{font-size:14px;line-height:1}

  /* ============ 可折叠的设置面板 ============ */
  .settings{
    background:var(--panel);border:1px solid var(--border);
    border-radius:var(--radius);margin-bottom:16px;
    overflow:hidden;
    animation:slideDown .22s ease;
  }
  @keyframes slideDown{
    from{opacity:0;transform:translateY(-6px)}
    to{opacity:1;transform:translateY(0)}
  }
  .settings-inner{padding:14px 16px}

  .settings-section{margin-bottom:16px}
  .settings-section:last-child{margin-bottom:0}
  .settings-section-title{
    font-size:12px;font-weight:600;color:var(--muted);
    text-transform:uppercase;letter-spacing:.5px;
    margin-bottom:9px;
    display:flex;align-items:center;gap:6px;
  }

  #repoInput{
    width:100%;min-height:60px;resize:vertical;padding:10px 12px;border-radius:8px;
    border:1px solid var(--border);background:#0d1117;color:var(--text);
    font-size:14px;outline:none;font-family:inherit;line-height:1.5;
  }
  #repoInput:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(47,129,247,.2)}

  .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
  .row button{flex:1 1 auto}

  button{
    padding:9px 15px;border-radius:8px;border:1px solid var(--border);
    background:var(--panel2);color:var(--text);font-size:13.5px;
    cursor:pointer;transition:.15s;font-family:inherit;
  }
  button:hover{background:#262c36;border-color:#484f58}
  button:disabled{opacity:.5;cursor:not-allowed}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.primary:hover{background:#1f6feb}
  button.danger:hover{background:#3d1418;border-color:var(--red);color:#ff7b72}
  button.small{font-size:12px;padding:6px 11px;border-radius:7px}

  .options{
    display:flex;gap:14px 18px;flex-wrap:wrap;align-items:center;
    font-size:13px;color:var(--muted);
  }
  .options label{display:flex;align-items:center;gap:6px;cursor:pointer}
  .options input[type=password]{
    padding:6px 9px;border-radius:6px;border:1px solid var(--border);
    background:#0d1117;color:var(--text);width:170px;font-size:13px;
    font-family:inherit;
  }
  .options input[type=password]:focus{outline:none;border-color:var(--accent)}
  .options select{
    padding:6px 8px;border-radius:6px;border:1px solid var(--border);
    background:#0d1117;color:var(--text);font-size:13px;font-family:inherit;
  }

  /* ===== 分类管理 ===== */
  .category-chips{
    display:flex;gap:8px;flex-wrap:wrap;min-height:0;margin-bottom:10px;
  }
  .cat-chip{
    display:inline-flex;align-items:center;gap:2px;
    background:var(--panel2);border:1px solid var(--border);
    border-radius:999px;padding:3px 3px 3px 11px;
    font-size:12px;color:var(--text);
    transition:.15s;
  }
  .cat-chip:hover{border-color:#484f58}
  .cat-chip .cat-count{color:var(--muted);font-size:11px;margin-left:2px}
  .cat-chip .cat-del{
    border:none;background:transparent;color:var(--muted);
    cursor:pointer;padding:0;margin-left:4px;
    font-size:13px;line-height:1;
    border-radius:50%;height:18px;width:18px;
    display:inline-flex;align-items:center;justify-content:center;
    font-family:inherit;
  }
  .cat-chip .cat-del:hover{background:rgba(248,81,73,.2);color:#ff7b72}
  .cat-empty{font-size:12px;color:var(--muted);font-style:italic;padding:2px 0}
  .cat-add-row{display:flex;gap:8px}
  .cat-add-row input{
    flex:1;min-width:0;padding:7px 10px;border-radius:7px;
    border:1px solid var(--accent);background:#0d1117;color:var(--text);
    font-size:13px;font-family:inherit;outline:none;
  }
  .cat-add-row input:focus{box-shadow:0 0 0 3px rgba(47,129,247,.2)}

  /* ===== 批量分类 ===== */
  .bulk-list{
    display:grid;grid-template-columns:repeat(auto-fill, minmax(min(100%,280px), 1fr));
    gap:8px;max-height:300px;overflow:auto;
    padding:10px;background:#0d1117;border:1px solid var(--border);
    border-radius:10px;
  }
  .bulk-item{
    display:flex;align-items:center;gap:8px;
    padding:6px 8px;border-radius:7px;background:var(--panel);
    border:1px solid var(--border);font-size:12px;
  }
  .bulk-item input[type=checkbox]{
    flex:0 0 auto;width:15px;height:15px;accent-color:var(--accent);
  }
  .bulk-item .bulk-name{
    flex:1 1 auto;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    color:var(--text);
  }
  .bulk-item .bulk-cat{
    flex:0 0 auto;font-size:10.5px;
    padding:1px 7px;border-radius:999px;
    background:rgba(163,113,247,.15);color:var(--purple);
    border:1px solid rgba(163,113,247,.3);
    max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .bulk-bar{
    margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;
    padding:10px;background:var(--panel2);border:1px solid var(--border);
    border-radius:9px;
  }
  .bulk-bar .bulk-count{font-size:12.5px;color:var(--muted);flex:0 0 auto}
  .bulk-bar .bulk-count b{color:var(--accent);font-weight:600}
  .bulk-bar select{
    flex:1;min-width:140px;padding:7px 9px;border-radius:7px;
    border:1px solid var(--border);background:var(--panel);
    color:var(--text);font-size:13px;font-family:inherit;
  }
  .bulk-bar select:focus{outline:none;border-color:var(--accent)}

  /* ===== 同步区 ===== */
  .sync-box{
    display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:13px;
  }
  .sync-box input{
    flex:1 1 240px;min-width:0;padding:8px 10px;border-radius:6px;
    border:1px solid var(--border);background:#0d1117;color:var(--text);
    font-size:13px;font-family:inherit;
  }
  .sync-box input:focus{outline:none;border-color:var(--accent)}
  #syncStatus{font-size:12px;color:var(--muted);white-space:nowrap}
  #syncStatus.ok{color:var(--green)}
  #syncStatus.err{color:var(--red)}
  #syncStatus.busy{color:var(--yellow)}

  .tip{font-size:12px;color:var(--muted);margin-top:9px;line-height:1.6}
  .tip code{background:#0d1117;padding:1px 5px;border-radius:4px;border:1px solid var(--border);font-size:11.5px}
  .tip b{color:var(--text)}

  /* ============ 列表区（主体） ============ */
  .list-toolbar{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    margin-bottom:16px;
    font-size:13px;color:var(--muted);
  }
  .list-toolbar .summary{
    font-size:13.5px;color:var(--text);font-weight:600;
    flex:1 1 auto;min-width:0;
  }
  .list-toolbar .summary .num{
    color:var(--green);
  }
  .list-toolbar select{
    padding:6px 10px;border-radius:7px;border:1px solid var(--border);
    background:var(--panel);color:var(--text);font-size:13px;font-family:inherit;
    max-width:200px;
  }
  .list-toolbar select:focus{outline:none;border-color:var(--accent)}
  #rateInfo{font-size:12px;white-space:nowrap}
  #lastRefresh{font-size:12px;white-space:nowrap;color:var(--muted)}

  #list{display:block}

  .category-group{margin-bottom:26px}
  .category-group:last-child{margin-bottom:0}

  .category-header{
    font-size:14px;font-weight:600;color:var(--text);
    padding:0 0 9px;margin-bottom:13px;
    border-bottom:1px solid var(--border);
    display:flex;align-items:center;gap:9px;
  }
  .category-header .cat-dot{
    width:8px;height:8px;border-radius:50%;
    background:var(--accent);flex:0 0 auto;
  }
  .category-header.is-uncat .cat-dot{background:var(--muted)}
  .category-header .cat-total{
    background:var(--panel2);color:var(--muted);
    font-size:11px;padding:1px 8px;border-radius:999px;
    font-weight:500;border:1px solid var(--border);
  }
  .category-header .cat-new-tip{
    color:var(--green);font-size:12px;font-weight:500;
    margin-left:auto;
  }

  .category-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(min(100%, 340px), 1fr));
    gap:14px;
  }

  .card{
    position:relative;background:var(--panel);border:1px solid var(--border);
    border-radius:var(--radius);padding:14px 16px;transition:.18s;
    overflow-wrap:anywhere;
  }
  .card:hover{border-color:#484f58;transform:translateY(-1px)}

  .card.is-new{
    border-color:var(--green);
    box-shadow:0 0 0 1px rgba(63,185,80,.35),0 6px 22px -12px rgba(63,185,80,.6);
    animation:newGlow 1.2s ease-in-out 6;
  }
  @keyframes newGlow{
    0%,100%{box-shadow:0 0 0 1px rgba(63,185,80,.35),0 6px 22px -12px rgba(63,185,80,.6)}
    50%    {box-shadow:0 0 0 3px rgba(63,185,80,.55),0 10px 30px -8px rgba(63,185,80,.9)}
  }
  @media (prefers-reduced-motion: reduce){
    .card.is-new{animation:none}
  }

  .card.is-new::before{
    content:"";position:absolute;left:0;top:14px;bottom:14px;width:4px;
    background:var(--green);border-radius:0 3px 3px 0;
  }
  .card.checking{opacity:.65}

  .card-head{
    display:flex;align-items:flex-start;justify-content:space-between;
    gap:10px;margin-bottom:10px;flex-wrap:wrap;
  }
  .repo-main{flex:1 1 auto;min-width:0}
  .repo-name{
    color:var(--accent);text-decoration:none;font-weight:600;font-size:15px;
    word-break:break-word;display:inline-block;max-width:100%;
  }
  .repo-name:hover{text-decoration:underline}

  .repo-note{
    display:inline-block;max-width:100%;margin-top:3px;
    font-size:13px;font-weight:600;color:#e3b341;
    word-break:break-word;overflow-wrap:anywhere;
    cursor:pointer;
  }
  .repo-note:hover{text-decoration:underline}
  .note-editor{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;width:100%}
  .note-editor input{
    flex:1 1 100%;min-width:0;padding:7px 9px;border-radius:7px;
    border:1px solid var(--accent);background:#0d1117;color:var(--text);
    font-size:13px;font-family:inherit;outline:none;
  }
  .note-editor input:focus{box-shadow:0 0 0 3px rgba(47,129,247,.2)}

  /* ===== 卡片分类选择器 ===== */
  .cat-row{
    margin-top:8px;display:flex;align-items:center;gap:8px;
    background:#0d1117;border:1px solid var(--border);
    border-radius:8px;padding:5px 10px;
    transition:.15s;
  }
  .cat-row:hover{border-color:#484f58}
  .cat-row:focus-within{
    border-color:var(--accent);
    box-shadow:0 0 0 2px rgba(47,129,247,.2);
  }
  .cat-row .cat-label{
    font-size:11.5px;color:var(--muted);flex:0 0 auto;
    white-space:nowrap;user-select:none;
  }
  .cat-select{
    flex:1;min-width:0;
    font-size:13px;padding:4px 6px;border-radius:5px;
    border:none;background:transparent;
    color:var(--text);cursor:pointer;font-family:inherit;
    outline:none;font-weight:500;
    -webkit-appearance:menulist;
    appearance:menulist;
  }
  .cat-select.is-empty{color:var(--muted)}
  .cat-select option{background:var(--panel2);color:var(--text)}

  .badge{font-size:11px;padding:2px 8px;border-radius:999px;white-space:nowrap;
         border:1px solid transparent;flex:0 0 auto}
  .badge.ok{background:rgba(63,185,80,.12);color:var(--green);border-color:rgba(63,185,80,.3)}
  .badge.new{background:rgba(63,185,80,.2);color:#56d364;border-color:var(--green);font-weight:700}
  .badge.warn{background:rgba(210,153,34,.15);color:var(--yellow);border-color:rgba(210,153,34,.4)}
  .badge.error{background:rgba(248,81,73,.12);color:#ff7b72;border-color:rgba(248,81,73,.3);
               max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .badge.loading{background:rgba(210,153,34,.12);color:var(--yellow);border-color:rgba(210,153,34,.3)}

  .version{
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:20px;font-weight:700;letter-spacing:.3px;margin-bottom:4px;
    word-break:break-word;overflow-wrap:anywhere;
  }
  .card.is-new .version{color:#56d364}
  .rel-name{font-size:12px;color:var(--muted);margin-bottom:4px;word-break:break-word}
  .meta{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
  .meta.hint{color:var(--yellow);margin-top:2px}

  details.assets{margin-top:10px;border:1px solid var(--border);border-radius:8px;background:#0d1117}
  details.assets>summary{
    cursor:pointer;padding:8px 11px;font-size:12px;color:var(--muted);
    list-style:none;user-select:none;
  }
  details.assets>summary::-webkit-details-marker{display:none}
  details.assets>summary::before{content:"▸ ";display:inline-block;transition:.15s}
  details.assets[open]>summary::before{transform:rotate(90deg)}
  details.assets ul{list-style:none;margin:0;padding:0 11px 9px;max-height:220px;overflow:auto}
  details.assets li{
    display:flex;justify-content:space-between;gap:10px;align-items:baseline;
    font-size:12px;padding:4px 0;border-top:1px dashed rgba(48,54,61,.7);
  }
  details.assets li:first-child{border-top:none}
  details.assets a{color:var(--accent);text-decoration:none;word-break:break-word;overflow-wrap:anywhere}
  details.assets a:hover{text-decoration:underline}
  details.assets .sz{color:var(--muted);white-space:nowrap;font-size:11px;flex:0 0 auto}

  .card-actions{
    display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;
    padding-top:12px;border-top:1px solid var(--border);
  }
  .card-actions button,.card-actions a{
    font-size:12px;padding:6px 11px;border-radius:7px;
  }
  .card-actions a{
    display:inline-block;text-decoration:none;color:var(--text);
    background:var(--panel2);border:1px solid var(--border);
  }
  .card-actions a:hover{background:#262c36;border-color:#484f58}

  .empty{
    text-align:center;color:var(--muted);padding:60px 20px;
    border:1px dashed var(--border);border-radius:var(--radius);font-size:14px;
  }
  .empty .big{font-size:38px;display:block;margin-bottom:10px;opacity:.7}
  .empty .hint-text{font-size:13px;margin-top:6px}

  .toast{
    position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);
    background:var(--panel2);border:1px solid var(--border);color:var(--text);
    padding:10px 18px;border-radius:8px;font-size:13px;opacity:0;
    transition:.25s;pointer-events:none;z-index:99;max-width:88vw;
    text-align:center;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* ============ 浏览器自动填充样式修复 ============ */
  input:-webkit-autofill,
  input:-webkit-autofill:hover,
  input:-webkit-autofill:focus,
  input:-webkit-autofill:active {
      -webkit-text-fill-color: var(--text);
      -webkit-box-shadow: 0 0 0px 1000px #0d1117 inset;
      transition: background-color 5000s ease-in-out 0s;
  }

  /* ============ 手机 ============ */
  @media (max-width: 640px){
    .app{padding:12px 10px calc(40px + env(safe-area-inset-bottom))}
    .topbar{gap:8px;margin-bottom:12px}
    .topbar .brand{font-size:15px;flex:1 1 100%}
    .topbar .tools{width:100%}
    .tool-btn{
      flex:1 1 auto;justify-content:center;
      padding:9px 10px;font-size:12.5px;min-width:0;
    }
    .tool-btn .label{display:none}
    .tool-btn .label-show{display:inline}
    .tool-btn .ic{font-size:16px}

    .settings-inner{padding:12px}

    .options{
      flex-direction:column;
      align-items:stretch;
      gap:10px;
    }
    .options label{justify-content:space-between;font-size:14px;padding:2px 0}
    .options input[type=password]{width:60%;max-width:220px}
    .options select{font-size:14px;padding:7px 9px}

    .sync-box{flex-direction:column;align-items:stretch;gap:8px}
    .sync-box input{width:100%;padding:10px}
    .sync-box button.small{flex:1 1 auto;padding:10px 12px;font-size:13px}
    #syncStatus{white-space:normal;text-align:center;padding-top:2px}

    .category-grid{grid-template-columns:1fr;gap:12px}
    .bulk-list{grid-template-columns:1fr;max-height:300px}
    .bulk-bar{flex-direction:column;align-items:stretch}
    .bulk-bar select{min-width:0;width:100%}
    .bulk-bar button{width:100%}

    .list-toolbar{gap:8px;margin-bottom:13px}
    .list-toolbar .summary{flex:1 1 100%;font-size:13px}
    .list-toolbar select{flex:1 1 auto;max-width:none;font-size:14px;padding:8px 10px}
    #rateInfo, #lastRefresh{flex:0 0 auto}

    .card{padding:13px 13px 11px}
    .version{font-size:19px}
    .cat-row{padding:7px 11px}
    .cat-select{font-size:14px}

    .card-actions button,
    .card-actions a{
      flex:1 1 auto;
      min-width:0;
      text-align:center;
      padding:9px 8px;
      font-size:12.5px;
    }
  }

  /* ============ 小屏手机 ============ */
  @media (max-width: 380px){
    .app{padding:10px 8px 36px}
    .topbar .brand{font-size:14px}
    .tool-btn{padding:8px 8px;font-size:12px}
    .version{font-size:18px}
    .card{padding:12px 12px 10px}
  }
</style>
</head>
<body>
<div class="app">

  <!-- ============ 顶部精简栏 ============ -->
  <div class="topbar">
    <div class="brand">
      🔔 <span>Release 监控</span>
      <span class="new-badge" id="topNewBadge" style="display:none">0</span>
    </div>
    <div class="tools">
      <button class="tool-btn primary" id="btnAdd" type="button">
        <span class="ic">＋</span><span class="label-show">添加</span>
      </button>
      <button class="tool-btn" id="btnRefresh" type="button">
        <span class="ic">🔄</span><span class="label-show">刷新</span>
      </button>
      <button class="tool-btn" id="btnCategory" type="button">
        <span class="ic">🏷️</span><span class="label-show">分类</span>
      </button>
      <button class="tool-btn" id="btnSync" type="button">
        <span class="ic">☁</span><span class="label-show">同步</span>
      </button>
      <button class="tool-btn" id="btnSettings" type="button">
        <span class="ic">⚙️</span><span class="label-show">设置</span>
      </button>
    </div>
  </div>

  <!-- ============ 添加面板（默认隐藏） ============ -->
  <section class="settings" id="panelAdd" style="display:none">
    <div class="settings-inner">
      <div class="settings-section-title">➕ 添加仓库</div>
      <form id="addForm" autocomplete="off">
        <textarea id="repoInput"

          额度右侧 <b>🔑</b> 表示 Token 生效，<b>👤</b> 表示未携带或无效。

  <section class="settings" id="panelSettings" style="display:none">

            <select id="autoRefresh">
              <option value="0">关闭</option>

<div class="toast" id="toast"></div>

<script>
(function(){
  'use strict';

  const STORAGE_KEY = 'gh-release-watcher-v1';
  const GIST_FILE   = 'gh-release-watcher.json';
  const NOTE_MAX    = 40;
  const CAT_MAX     = 12;

  const state = {
    repos: [],
    categories: [],
    token: '',
    gistId: '',
    updatedAt: 0,
    includePrerelease: false,
    autoRefreshMinutes: 0,
    rate: null,
    editingNote: null,
    filterCategory: '__all__',
    bulkSelected: {},
    openPanel: null     // 'add' | 'category' | 'sync' | 'settings' | null
  };

  /* ---------------- 本地持久化 ---------------- */

  function load(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return;
      const d = JSON.parse(raw);
      state.repos = (d.repos || []).map(r => ({
        fullName: r.fullName,
        note: r.note || '',
        category: r.category || '',
        lastSeenTag: r.lastSeenTag ?? null,
        latest: r.latest || null,
        error: null,
        lastCheck: r.lastCheck || null,
        isNew: false,
        isRollback: false,
        previousTag: null,
        checking: false
      }));
      state.categories = Array.isArray(d.categories)
        ? d.categories.filter(c => typeof c === 'string' && c.trim()).slice(0, 60)
        : [];
      state.token = d.token || '';
      state.gistId = d.gistId || '';
      state.updatedAt = d.updatedAt || 0;
      state.includePrerelease = !!d.includePrerelease;
      state.autoRefreshMinutes = d.autoRefreshMinutes || 0;
    }catch(e){ console.warn('读取本地数据失败', e); }
  }

  function save(opts){
    opts = opts || {};
    if(opts.touch !== false) state.updatedAt = Date.now();
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        repos: state.repos.map(r => ({
          fullName: r.fullName,
          note: r.note || '',
          category: r.category || '',
          lastSeenTag: r.lastSeenTag,
          latest: r.latest,
          lastCheck: r.lastCheck
        })),
        categories: state.categories,
        token: state.token,
        gistId: state.gistId,
        updatedAt: state.updatedAt,
        includePrerelease: state.includePrerelease,
        autoRefreshMinutes: state.autoRefreshMinutes
      }));
    }catch(e){ console.warn('保存失败', e); }
    if(opts.push !== false) schedulePush();
  }

  /* ---------------- 工具函数 ---------------- */

  function esc(s){
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  function parseRepo(input){
    if(!input) return null;
    let s = String(input).trim();
    if(!s) return null;
    let note = '';
    const i = s.search(/[|｜]/);
    if(i >= 0){
      note = s.slice(i + 1).trim();
      s = s.slice(0, i).trim();
      if(!s) return null;
    }
    let m = s.match(/github\.com[/:]([^/\s?#]+)\/([^/\s?#]+)/i);
    if(m) return { fullName: (m[1] + '/' + m[2]).replace(/\.git$/i,''), note };
    m = s.match(/^([A-Za-z0-9_.-]+)\/([A-Za-z0-9_.-]+)$/);
    if(m) return { fullName: m[1] + '/' + m[2].replace(/\.git$/i,''), note };
    return null;
  }

  function relTime(ts){
    const diff = Math.max(0, Date.now() - ts);
    if(diff < 60000) return '刚刚';
    const m = Math.floor(diff / 60000);
    if(m < 60) return m + ' 分钟前';
    const h = Math.floor(m / 60);
    if(h < 24) return h + ' 小时前';
    return Math.floor(h / 24) + ' 天前';
  }

  function fmtDate(iso){
    const d = new Date(iso);
    if(isNaN(d)) return '';
    const p = n => String(n).padStart(2,'0');
    return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
  }

  function fmtSize(n){
    if(typeof n !== 'number' || isNaN(n)) return '';
    if(n < 1024) return n + ' B';
    const u = ['KB','MB','GB'];
    let i = -1;
    do { n /= 1024; i++; } while(n >= 1024 && i < u.length - 1);
    return n.toFixed(n >= 100 ? 0 : 1) + ' ' + u[i];
  }

  function nowTime(){
    return new Date().toLocaleTimeString('zh-CN', {hour12:false});
  }

  /* ---- 版本号比较 ---- */

  function parseVersion(tag){
    const s = String(tag == null ? '' : tag).trim().replace(/^[vV]\s*/, '');
    const m = s.match(/^(\d+(?:\.\d+)*)(.*)$/);
    if(!m) return null;
    return {
      nums: m[1].split('.').map(Number),
      pre: m[2].replace(/^[-_.+\s]+/, '').toLowerCase()
    };
  }

  function compareVersions(a, b){
    if(a === b) return 0;
    const A = parseVersion(a), B = parseVersion(b);
    if(!A || !B) return String(a) > String(b) ? 1 : -1;
    const n = Math.max(A.nums.length, B.nums.length);
    for(let i = 0; i < n; i++){
      const x = A.nums[i] || 0, y = B.nums[i] || 0;
      if(x !== y) return x > y ? 1 : -1;
    }
    if(A.pre === B.pre) return 0;
    if(!A.pre) return 1;
    if(!B.pre) return -1;
    const partsA = A.pre.split(/[-_.]/);
    const partsB = B.pre.split(/[-_.]/);
    const len = Math.max(partsA.length, partsB.length);
    for(let i = 0; i < len; i++) {
      const pA = partsA[i] || '', pB = partsB[i] || '';
      const isNumA = /^\d+$/.test(pA);
      const isNumB = /^\d+$/.test(pB);
      if (isNumA && isNumB) {
        const nA = parseInt(pA, 10), nB = parseInt(pB, 10);
        if (nA !== nB) return nA > nB ? 1 : -1;
      } else {
        if (pA !== pB) return pA > pB ? 1 : -1;
      }
    }
    return 0;
  }

  let toastTimer = null;
  function toast(msg){
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2400);
  }

  /* ---------------- GitHub API ---------------- */

  function cleanHeaderValue(v){
    return String(v == null ? '' : v).replace(/[^\x20-\x7E\x80-\xFF]/g, '');
  }

  function currentToken(){
    const el = document.getElementById('tokenInput');
    const uiToken = el ? el.value.trim().replace(/[^\x21-\x7E]/g, '') : '';
    return uiToken || (state.token || '').trim();
  }

  async function ghFetch(path, init){
    const effectiveToken = currentToken();
    if(effectiveToken && effectiveToken !== state.token) state.token = effectiveToken;
    const headers = Object.assign(
      { 'Accept': 'application/vnd.github+json' },
      (init && init.headers) || {}
    );
    if(effectiveToken) headers['Authorization'] = 'Bearer ' + effectiveToken;
    Object.keys(headers).forEach(k => { headers[k] = cleanHeaderValue(headers[k]); });
    const res = await fetch('https://api.github.com' + path,
      Object.assign({}, init, { headers }));
    const rem = res.headers.get('x-ratelimit-remaining');
    if(rem !== null){
      state.rate = {
        remaining: Number(rem),
        limit: Number(res.headers.get('x-ratelimit-limit')),
        reset: Number(res.headers.get('x-ratelimit-reset')),
        authed: !!effectiveToken
      };
      renderRate();
    }
    return res;
  }

  function rateMsg(res){
    const reset = res.headers.get('x-ratelimit-reset');
    if(reset){
      const t = new Date(Number(reset) * 1000);
      const p = n => String(n).padStart(2,'0');
      return `API 额度用尽，${p(t.getHours())}:${p(t.getMinutes())} 后重置`;
    }
    return 'API 访问被拒绝（可能是额度用尽）';
  }

  function isRateLimited(res){ return res.status === 403 || res.status === 429; }

  function pseudoReleaseFromTag(repo, tagName){
    return {
      tag_name: tagName,
      name: tagName,
      html_url: `https://github.com/${repo.fullName}/releases/tag/${encodeURIComponent(tagName)}`,
      published_at: null,
      prerelease: false,
      assets: []
    };
  }

  function normalizeRelease(release){
    return {
      tag: release.tag_name,
      name: release.name || release.tag_name,
      url: release.html_url || '#',
      publishedAt: release.published_at || null,
      prerelease: !!release.prerelease,
      assets: (release.assets || []).map(a => ({
        name: a.name, size: a.size, url: a.browser_download_url
      }))
    };
  }

  async function fetchLatestRelease(repo){
    if(state.includePrerelease){
      const res = await ghFetch(`/repos/${repo.fullName}/releases?per_page=1`);
      if(isRateLimited(res)) throw new Error(rateMsg(res));
      if(res.status === 401) throw new Error('Token 无效或缺少权限');
      if(res.status === 404) throw new Error('仓库不存在或不可访问');
      if(!res.ok) throw new Error('HTTP ' + res.status);
      const arr = await res.json();
      if(arr.length) return arr[0];
    }else{
      const res = await ghFetch(`/repos/${repo.fullName}/releases/latest`);
      if(isRateLimited(res)) throw new Error(rateMsg(res));
      if(res.status === 401) throw new Error('Token 无效或缺少权限');
      if(res.ok) return await res.json();
      if(res.status !== 404) throw new Error('HTTP ' + res.status);
    }
    const rt = await ghFetch(`/repos/${repo.fullName}/tags?per_page=1`);
    if(isRateLimited(rt)) throw new Error(rateMsg(rt));
    if(rt.status === 404) throw new Error('仓库不存在或不可访问');
    if(!rt.ok) throw new Error('HTTP ' + rt.status);
    const tags = await rt.json();
    if(tags.length) return pseudoReleaseFromTag(repo, tags[0].name);
    return null;
  }

  async function checkRepo(repo){
    if(repo.checking) return;
    repo.checking = true;
    repo.error = null;
    render();

    try{
      const release = await fetchLatestRelease(repo);
      repo.lastCheck = Date.now();
      if(release){
        repo.latest = normalizeRelease(release);
        const tag = repo.latest.tag;
        if(repo.lastSeenTag == null){
          repo.lastSeenTag = tag;
          repo.isNew = false;
          repo.isRollback = false;
          repo.previousTag = null;
        }else{
          const c = compareVersions(tag, repo.lastSeenTag);
          repo.isNew = c > 0;
          repo.isRollback = c < 0;
          repo.previousTag = (c !== 0) ? repo.lastSeenTag : null;
          if(c !== 0) repo.lastSeenTag = tag;
        }
        repo.error = null;
      }else{
        repo.latest = null;
        repo.isNew = false;
        repo.isRollback = false;
        repo.previousTag = null;
        repo.error = '没有找到 Release 或 Tag';
      }
    }catch(e){
      repo.lastCheck = Date.now();
      const msg = e.message || '请求失败';
      repo.error = /Failed to fetch|NetworkError|Load failed/i.test(msg)
        ? '网络连接失败，请检查网络'
        : msg;
    }finally{
      repo.checking = false;
      save();
      render();
      updateTitle();
    }
  }

  let refreshing = false;
  async function refreshAll(){
    if(refreshing || !state.repos.length) return;
    refreshing = true;
    const btn = document.getElementById('btnRefresh');
    btn.disabled = true;
    const oldHtml = btn.innerHTML;
    btn.innerHTML = '<span class="ic">⏳</span><span class="label-show">刷新中</span>';
    await Promise.all(state.repos.map(r => checkRepo(r)));
    refreshing = false;
    btn.disabled = false;
    btn.innerHTML = oldHtml;
    document.getElementById('lastRefresh').textContent = nowTime();
    save();
    updateTitle();
    const newCount = state.repos.filter(r => r.isNew).length;
    if(newCount) toast(`🎉 发现 ${newCount} 个新版本`);
  }

  /* ---------------- 云同步 ---------------- */

  const sync = { busy: false, pushTimer: null, lastAt: null };

  function syncReady(){ return !!(state.gistId && currentToken()); }

  function setSyncStatus(kind, text){
    const el = document.getElementById('syncStatus');
    el.className = kind ? kind : '';
    el.textContent = text || '';
  }

  function cloudPayload(){
    return JSON.stringify({
      version: 1,
      updatedAt: state.updatedAt || 0,
      savedAt: new Date().toISOString(),
      categories: state.categories,
      repos: state.repos.map(r => ({
        fullName: r.fullName,
        note: r.note || '',
        category: r.category || '',
        lastSeenTag: r.lastSeenTag,
        latest: r.latest,
        lastCheck: r.lastCheck
      }))
    }, null, 2);
  }

  function applyRemote(remote){
    state.categories = Array.isArray(remote.categories)
      ? remote.categories.filter(c => typeof c === 'string' && c.trim()).slice(0, 60)
      : [];
    state.repos = (remote.repos || []).map(r => ({
      fullName: r.fullName,
      note: r.note || '',
      category: r.category || '',
      lastSeenTag: r.lastSeenTag ?? null,
      latest: r.latest || null,
      error: null,
      lastCheck: r.lastCheck || null,
      isNew: false,
      isRollback: false,
      previousTag: null,
      checking: false
    }));
    state.updatedAt = remote.updatedAt || 0;
    state.editingNote = null;
  }

  async function cloudPull(silent){
    if(!syncReady()){
      if(!silent) toast('请先填写 Token 并创建/绑定 Gist');
      return { ok:false, error:'未配置同步' };
    }
    if(sync.busy) return { ok:false, error:'正在同步中' };
    sync.busy = true;
    setSyncStatus('busy', '⏳ 拉取中…');
    try{
      const res = await ghFetch('/gists/' + state.gistId);
      if(res.status === 404) throw new Error('Gist 不存在或 Token 无权限');
      if(res.status === 401) throw new Error('Token 无效或缺少 gist 权限');
      if(!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      const file = data.files && data.files[GIST_FILE];
      if(!file || !file.content){
        setSyncStatus('ok', '✓ 云端为空，已就绪');
        sync.lastAt = Date.now();
        return { ok:true, applied:false };
      }
      let remote;
      try{ remote = JSON.parse(file.content); }
      catch(e){ throw new Error('云端数据格式异常'); }
      const remoteRepos = remote.repos || [];
      const localRepos = state.repos || [];
      const remoteAt = remote.updatedAt || 0;
      const localAt = state.updatedAt || 0;

      if(remoteRepos.length === 0 && localRepos.length > 0){
        setSyncStatus('busy', '⏳ 云端为空，正在上传本地数据…');
        try{
          const pr = await ghFetch('/gists/' + state.gistId, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ files: { [GIST_FILE]: { content: cloudPayload() } } })
          });
          if(!pr.ok) throw new Error('HTTP ' + pr.status);
          setSyncStatus('ok', '✓ 云端为空，已上传本地 ' + nowTime());
          sync.lastAt = Date.now();
          return { ok:true, applied:false, restored:true };
        }catch(e){
          setSyncStatus('err', '⚠ 上传失败：' + (e.message || ''));
          return { ok:false, error: e.message || '上传失败' };
        }
      }

      if(remoteAt > localAt){
        applyRemote(remote);
        save({ touch:false, push:false });
        render(); updateTitle();
        setSyncStatus('ok', '✓ 已从云端更新 ' + nowTime());
        sync.lastAt = Date.now();
        return { ok:true, applied:true };
      }
      setSyncStatus('ok', '✓ 本地已是最新 ' + nowTime());
      sync.lastAt = Date.now();
      return { ok:true, applied:false };
    }catch(e){
      setSyncStatus('err', '⚠ ' + (e.message || '拉取失败'));
      if(!silent) toast('拉取失败：' + (e.message || ''));
      return { ok:false, error: e.message || '拉取失败' };
    }finally{ sync.busy = false; }
  }

  async function cloudPush(silent){
    if(!syncReady()){
      if(!silent) toast('请先填写 Token 并创建/绑定 Gist');
      return { ok:false, error:'未配置同步' };
    }
    if(sync.busy) return { ok:false, error:'正在同步中' };
    sync.busy = true;
    setSyncStatus('busy', '⏳ 推送中…');
    try{
      const res = await ghFetch('/gists/' + state.gistId, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ files: { [GIST_FILE]: { content: cloudPayload() } } })
      });
      if(res.status === 404) throw new Error('Gist 不存在或 Token 无权限');
      if(res.status === 401) throw new Error('Token 无效或缺少 gist 权限');
      if(!res.ok) throw new Error('HTTP ' + res.status);
      setSyncStatus('ok', '✓ 已同步 ' + nowTime());
      sync.lastAt = Date.now();
      return { ok:true };
    }catch(e){
      setSyncStatus('err', '⚠ ' + (e.message || '推送失败'));
      if(!silent) toast('推送失败：' + (e.message || ''));
      return { ok:false, error: e.message || '推送失败' };
    }finally{ sync.busy = false; }
  }

  function schedulePush(){
    if(!syncReady()) return;
    clearTimeout(sync.pushTimer);
    setSyncStatus('busy', '⏳ 待同步…');
    sync.pushTimer = setTimeout(() => cloudPush(true), 2500);
  }

  function ensureCloudHasData(){
    if(!syncReady()) return;
    if(state.repos.length > 0 && (state.updatedAt || 0) > 0){
      cloudPush(true);
    }
  }

  async function createGist(){
    if(!currentToken()){ toast('请先填写带 gist 权限的 Token'); return; }
    if(state.gistId && !confirm('已绑定 Gist，重新创建会生成一个新的，确定继续？')) return;
    setSyncStatus('busy', '⏳ 创建中…');
    try{
      const res = await ghFetch('/gists', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          description: 'GitHub Release Watcher 同步数据',
          public: false,
          files: { [GIST_FILE]: { content: cloudPayload() } }
        })
      });
      if(res.status === 401) throw new Error('Token 无效或缺少 gist 权限');
      if(!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      state.gistId = data.id;
      document.getElementById('gistInput').value = data.id;
      save({ touch:false });
      setSyncStatus('ok', '✓ 已创建 ' + data.id.slice(0,8) + '…');
      toast('私有 Gist 已创建，其他设备填这个 ID + 同一个 Token 即可同步');
    }catch(e){
      setSyncStatus('err', '⚠ ' + (e.message || '创建失败'));
      toast('创建失败：' + (e.message || ''));
    }
  }

  /* ---------------- 分类管理 ---------------- */

  function addCategory(name){
    const n = String(name || '').trim().slice(0, CAT_MAX);
    if(!n){ toast('分类名不能为空'); return false; }
    if(state.categories.includes(n)){ toast('分类「' + n + '」已存在'); return false; }
    if(state.categories.length >= 60){ toast('分类数量已达上限'); return false; }
    state.categories.push(n);
    save(); render();
    toast('已添加分类：' + n);
    return true;
  }

  function deleteCategory(name){
    if(!confirm(`删除分类「${name}」？\n该分类下的仓库会变为「未分类」，不会删除仓库。`)) return;
    state.categories = state.categories.filter(c => c !== name);
    let moved = 0;
    state.repos.forEach(r => {
      if(r.category === name){ r.category = ''; moved++; }
    });
    if(state.filterCategory === name) state.filterCategory = '__all__';
    save(); render();
    toast(moved ? `已删除分类，${moved} 个仓库移到「未分类」` : '已删除分类');
  }

  function renderCategoryChips(){
    const el = document.getElementById('categoryChips');
    if(!state.categories.length){
      el.innerHTML = '<span class="cat-empty">还没有分类，点右侧「＋ 新建分类」添加</span>';
      return;
    }
    el.innerHTML = state.categories.map(c => {
      const count = state.repos.filter(r => r.category === c).length;
      return `<span class="cat-chip">
        <span class="cat-name">${esc(c)}</span>
        <span class="cat-count">${count}</span>
        <button type="button" class="cat-del" data-cat-del="${esc(c)}" title="删除分类">×</button>
      </span>`;
    }).join('');
  }

  function renderFilterSelect(){
    const sel = document.getElementById('filterCategory');
    if(!sel) return;
    const cur = state.filterCategory || '__all__';
    let html = `<option value="__all__">全部分类</option>`;
    state.categories.forEach(c => {
      const count = state.repos.filter(r => r.category === c).length;
      html += `<option value="${esc(c)}"${cur === c ? ' selected' : ''}>${esc(c)} (${count})</option>`;
    });
    const unCount = state.repos.filter(r => !r.category).length;
    if(unCount > 0){
      html += `<option value="__none__"${cur === '__none__' ? ' selected' : ''}>未分类 (${unCount})</option>`;
    }
    sel.innerHTML = html;
    if(cur !== '__all__' && cur !== '__none__' && !state.categories.includes(cur)){
      state.filterCategory = '__all__';
      sel.value = '__all__';
    }
  }

  /* ---------------- 批量分类 ---------------- */

  function renderBulk(){
    const listEl = document.getElementById('bulkList');
    const selEl = document.getElementById('bulkCategorySel');
    const countEl = document.getElementById('bulkCount');
    if(!listEl || !selEl || !countEl) return;

    if(!state.repos.length){
      listEl.innerHTML = '<div class="cat-empty">还没有仓库</div>';
      countEl.textContent = '0';
      selEl.innerHTML = '';
      return;
    }

    const sorted = state.repos.slice().sort((a, b) => {
      const ca = a.category || '\uffff';
      const cb = b.category || '\uffff';
      if(ca !== cb) return ca.localeCompare(cb);
      return a.fullName.localeCompare(b.fullName);
    });

    listEl.innerHTML = sorted.map(r => {
      const checked = state.bulkSelected[r.fullName] ? ' checked' : '';
      const catTxt = r.category || '未分类';
      return `<label class="bulk-item">
        <input type="checkbox" data-bulk-name="${esc(r.fullName)}"${checked}>
        <span class="bulk-name" title="${esc(r.fullName)}">${esc(r.fullName)}</span>
        <span class="bulk-cat" title="${esc(catTxt)}">${esc(catTxt)}</span>
      </label>`;
    }).join('');

    let opts = `<option value="">— 移到未分类 —</option>`;
    state.categories.forEach(c => { opts += `<option value="${esc(c)}">${esc(c)}</option>`; });
    selEl.innerHTML = opts;
    countEl.textContent = String(Object.keys(state.bulkSelected).filter(k => state.bulkSelected[k]).length);
  }

  /* ---------------- 备注编辑 ---------------- */

  function commitNote(editorEl){
    if(!editorEl) return;
    const fullName = editorEl.dataset.repo;
    const repo = state.repos.find(r => r.fullName === fullName);
    if(!repo) return;
    const inp = editorEl.querySelector('.note-input');
    const val = String(inp ? inp.value : '').trim().slice(0, NOTE_MAX);
    repo.note = val;
    state.editingNote = null;
    save(); render();
    toast(val ? '备注已保存' : '备注已清除');
  }

  /* ---------------- 渲染 ---------------- */

  function renderRate(){
    const el = document.getElementById('rateInfo');
    if(state.rate && !isNaN(state.rate.remaining)){
      const authed = state.rate.limit > 60;
      el.textContent =
        `API ${state.rate.remaining}/${state.rate.limit}` +
        (authed ? ' 🔑' : ' 👤');
      el.style.color =
        state.rate.remaining < 10 ? 'var(--red)' :
        (authed ? 'var(--green)' : 'var(--yellow)');
      el.title = authed
        ? 'Token 生效中，额度 5000/小时'
        : '请求未携带 Token 或 Token 无效，额度仅 60/小时';
    }else{
      el.textContent = '';
      el.style.color = '';
      el.title = '';
    }
  }

  function repoRank(r){
    if(r.isNew) return 0;
    if(r.isRollback) return 1;
    return 2;
  }

  function cardHtml(repo){
    const latest = repo.latest;
    let badge;

    if(repo.checking){
      badge = '<span class="badge loading">检查中…</span>';
    }else if(repo.error){
      badge = `<span class="badge error" title="${esc(repo.error)}">⚠ ${esc(repo.error)}</span>`;
    }else if(repo.isNew){
      badge = '<span class="badge new">🎉 有新版本</span>';
    }else if(repo.isRollback){
      badge = '<span class="badge warn">↩ 版本回退</span>';
    }else if(latest){
      badge = '<span class="badge ok">✓ 已是最新</span>';
    }else{
      badge = '<span class="badge">—</span>';
    }

    let noteHtml = '';
    if(state.editingNote === repo.fullName){
      noteHtml = `<div class="note-editor" data-repo="${esc(repo.fullName)}">
          <input class="note-input" type="text" maxlength="${NOTE_MAX}"
                 placeholder="输入中文备注，如：金手指 / 存档工具"
                 value="${esc(repo.note || '')}">
          <button class="primary small" data-action="note-save" data-repo="${esc(repo.fullName)}">保存</button>
          <button class="small" data-action="note-cancel" data-repo="${esc(repo.fullName)}">取消</button>
        </div>`;
    }else if(repo.note){
      noteHtml = `<div class="repo-note" data-repo="${esc(repo.fullName)}"
                       title="点击修改备注">${esc(repo.note)}</div>`;
    }

    const curCat = repo.category || '';
    let catOpts = `<option value=""${curCat === '' ? ' selected' : ''}>— 未分类 —</option>`;
    state.categories.forEach(c => {
      catOpts += `<option value="${esc(c)}"${curCat === c ? ' selected' : ''}>${esc(c)}</option>`;
    });
    const catRow = `<div class="cat-row" title="点击下拉框切换分类">
        <span class="cat-label">🏷️</span>
        <select class="cat-select${curCat ? '' : ' is-empty'}"
                data-repo="${esc(repo.fullName)}">${catOpts}</select>
      </div>`;

    const version = latest ? esc(latest.tag) : '—';
    const relName = (latest && latest.name && latest.name !== latest.tag)
      ? `<div class="rel-name">${esc(latest.name)}</div>` : '';

    const metaParts = [];
    if(latest && latest.publishedAt) metaParts.push('发布：' + fmtDate(latest.publishedAt));
    if(latest && latest.prerelease) metaParts.push('预发布');
    metaParts.push('检查：' + (repo.lastCheck ? relTime(repo.lastCheck) : '未检查'));
    const meta = metaParts.join(' · ');

    const hint = (repo.previousTag && (repo.isNew || repo.isRollback))
      ? `<div class="meta hint">${repo.isNew ? '⬆ 上一版本' : '↩ 回退前'}：${esc(repo.previousTag)} → ${esc(latest ? latest.tag : '')}</div>`
      : '';

    const assets = (latest && latest.assets && latest.assets.length)
      ? `<details class="assets">
           <summary>📦 ${latest.assets.length} 个下载文件</summary>
           <ul>${latest.assets.map(a =>
             `<li><a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.name)}</a>` +
             `<span class="sz">${fmtSize(a.size)}</span></li>`).join('')}</ul>
         </details>`
      : '';

    return `
      <div class="card${repo.isNew ? ' is-new' : ''}${repo.checking ? ' checking' : ''}">
        <div class="card-head">
          <div class="repo-main">
            <a class="repo-name" href="https://github.com/${esc(repo.fullName)}"
               target="_blank" rel="noopener">${esc(repo.fullName)}</a>
            ${noteHtml}
            ${catRow}
          </div>
          ${badge}
        </div>
        <div class="version">${version}</div>
        ${relName}
        <div class="meta">${esc(meta)}</div>
        ${hint}
        ${assets}
        <div class="card-actions">
          ${latest && latest.url && latest.url !== '#' ? `<a href="${esc(latest.url)}" target="_blank" rel="noopener">查看 Release</a>` : ''}
          ${repo.isNew ? `<button class="primary" data-action="read" data-repo="${esc(repo.fullName)}">标记已读</button>` : ''}
          <button data-action="note" data-repo="${esc(repo.fullName)}">📝 ${repo.note ? '改备注' : '备注'}</button>
          <button data-action="check" data-repo="${esc(repo.fullName)}">刷新</button>
          <button class="danger" data-action="remove" data-repo="${esc(repo.fullName)}">删除</button>
        </div>
      </div>`;
  }

  function render(){
    const list = document.getElementById('list');
    const empty = document.getElementById('empty');
    const summary = document.getElementById('listSummary');

    renderCategoryChips();
    renderFilterSelect();
    if(state.openPanel === 'category') renderBulk();

    // 更新顶部 badge
    const newTotal = state.repos.filter(r => r.isNew).length;
    const topBadge = document.getElementById('topNewBadge');
    if(newTotal > 0){
      topBadge.textContent = newTotal;
      topBadge.style.display = '';
    }else{
      topBadge.style.display = 'none';
    }

    if(!state.repos.length){
      list.innerHTML = '';
      empty.style.display = 'block';
      summary.textContent = '还没有关注的仓库';
      return;
    }
    empty.style.display = 'none';

    // 概览
    const total = state.repos.length;
    const checked = state.repos.filter(r => r.lastCheck).length;
    const newCount = state.repos.filter(r => r.isNew).length;
    let sumText = `共 ${total} 个仓库`;
    if(newCount > 0){
      sumText += ` · <span class="num">${newCount} 个有新版本</span>`;
    }else if(checked > 0){
      sumText += ` · 暂无更新`;
    }
    summary.innerHTML = sumText;

    const filter = state.filterCategory || '__all__';
    const groups = new Map();
    state.repos.forEach(r => {
      const cat = r.category || '';
      if(!groups.has(cat)) groups.set(cat, []);
      groups.get(cat).push(r);
    });

    const orderedCats = [];
    state.categories.forEach(c => { if(groups.has(c)) orderedCats.push(c); });
    if(groups.has('')) orderedCats.push('');

    let visibleCats = orderedCats;
    if(filter === '__none__'){
      visibleCats = orderedCats.filter(c => c === '');
    }else if(filter !== '__all__'){
      visibleCats = orderedCats.filter(c => c === filter);
    }

    if(!visibleCats.length){
      list.innerHTML = '<div class="empty">当前分类下没有仓库</div>';
      return;
    }

    let html = '';
    visibleCats.forEach(cat => {
      const repos = groups.get(cat).slice();
      repos.sort((a, b) => (repoRank(a) - repoRank(b)) || a.fullName.localeCompare(b.fullName));

      const catName = cat || '未分类';
      const newCnt = repos.filter(r => r.isNew).length;
      const headerCls = 'category-header' + (cat ? '' : ' is-uncat');
      const newTip = newCnt
        ? `<span class="cat-new-tip">🎉 ${newCnt} 个有新版本</span>`
        : '';

      html += `<section class="category-group">
        <div class="${headerCls}">
          <span class="cat-dot"></span>
          <span class="cat-title">${esc(catName)}</span>
          <span class="cat-total">${repos.length}</span>
          ${newTip}
        </div>
        <div class="category-grid">
          ${repos.map(cardHtml).join('')}
        </div>
      </section>`;
    });

    list.innerHTML = html;

    if(state.editingNote){
      const inp = list.querySelector('.note-input');
      if(inp){ try{ inp.focus(); }catch(e){} }
    }
  }

  function updateTitle(){
    const n = state.repos.filter(r => r.isNew).length;
    document.title = (n ? `(${n}) ` : '') + 'GitHub Release 更新监控';
  }

  /* ---------------- 面板切换 ---------------- */

  function setPanel(name){
    const panels = {
      add: 'panelAdd',
      category: 'panelCategory',
      sync: 'panelSync',
      settings: 'panelSettings'
    };
    const btns = {
      add: 'btnAdd',
      category: 'btnCategory',
      sync: 'btnSync',
      settings: 'btnSettings'
    };

    // 关闭所有，再打开目标
    Object.keys(panels).forEach(k => {
      const el = document.getElementById(panels[k]);
      const btn = document.getElementById(btns[k]);
      if(k === name && state.openPanel !== name){
        el.style.display = '';
        btn.classList.add('active');
      }else{
        el.style.display = 'none';
        btn.classList.remove('active');
      }
    });

    const wasOpen = state.openPanel === name;
    state.openPanel = wasOpen ? null : name;

    // 如果打开的是分类面板，刷新批量列表
    if(state.openPanel === 'category'){
      renderBulk();
    }
  }

  /* ---------------- 交互 ---------------- */

  document.getElementById('addForm').addEventListener('submit', function(e){
    e.preventDefault();
    const input = document.getElementById('repoInput');
    const raw = input.value;

    const candidates = [];
    String(raw).split(/\r?\n/).forEach(line => {
      const l = line.trim();
      if(!l) return;
      if(/[|｜]/.test(l)){
        candidates.push(l);
      }else{
        l.split(/[\s,;，；、]+/).filter(Boolean).forEach(t => candidates.push(t));
      }
    });

    const parsed = [];
    let invalid = 0;
    let noteUpdated = 0;

    candidates.forEach(t => {
      const p = parseRepo(t);
      if(!p){ invalid++; return; }
      const exist = state.repos.find(
        r => r.fullName.toLowerCase() === p.fullName.toLowerCase()
      );
      if(exist){
        if(p.note && p.note !== exist.note){
          exist.note = p.note.slice(0, NOTE_MAX);
          noteUpdated++;
        }
        return;
      }
      if(parsed.some(x => x.fullName.toLowerCase() === p.fullName.toLowerCase())) return;
      parsed.push(p);
    });

    if(!parsed.length){
      if(noteUpdated){
        input.value = '';
        save(); render();
        toast(`已更新 ${noteUpdated} 个仓库的备注`);
        return;
      }
      toast(invalid ? '格式不对，请输入 owner/repo 或完整 GitHub 链接' : '这些仓库都已经在列表里了');
      return;
    }

    const newRepos = parsed.map(p => ({
      fullName: p.fullName,
      note: (p.note || '').slice(0, NOTE_MAX),
      category: '',
      lastSeenTag: null, latest: null,
      error: null, lastCheck: null, checking: false,
      isNew: false, isRollback: false, previousTag: null
    }));

    state.repos = newRepos.concat(state.repos);
    input.value = '';
    save(); render();

    toast(`已添加 ${newRepos.length} 个仓库${invalid ? `，忽略 ${invalid} 条无效输入` : ''}`);
    newRepos.forEach(r => checkRepo(r));
  });

  const listEl = document.getElementById('list');

  listEl.addEventListener('change', function(e){
    const sel = e.target;
    if(!sel.classList || !sel.classList.contains('cat-select')) return;
    const repo = state.repos.find(r => r.fullName === sel.dataset.repo);
    if(!repo) return;
    const newCat = sel.value || '';
    if(repo.category === newCat) return;
    repo.category = newCat;
    save(); render();
    toast(newCat ? `已归入「${newCat}」` : '已移到「未分类」');
  });

  listEl.addEventListener('click', async function(e){
    const noteEl = e.target.closest('.repo-note');
    if(noteEl && noteEl.dataset.repo){
      state.editingNote = noteEl.dataset.repo;
      render();
      return;
    }
    const btn = e.target.closest('button[data-action]');
    if(!btn) return;
    const repo = state.repos.find(r => r.fullName === btn.dataset.repo);
    if(!repo) return;
    const action = btn.dataset.action;

    if(action === 'check'){
      await checkRepo(repo);
      document.getElementById('lastRefresh').textContent = nowTime();
    }else if(action === 'remove'){
      state.repos = state.repos.filter(r => r !== repo);
      if(state.editingNote === repo.fullName) state.editingNote = null;
      delete state.bulkSelected[repo.fullName];
      save(); render(); updateTitle();
      toast('已删除 ' + repo.fullName);
    }else if(action === 'read'){
      repo.isNew = false;
      repo.isRollback = false;
      repo.previousTag = null;
      if(repo.latest) repo.lastSeenTag = repo.latest.tag;
      save(); render(); updateTitle();
    }else if(action === 'note'){
      state.editingNote = (state.editingNote === repo.fullName) ? null : repo.fullName;
      render();
    }else if(action === 'note-save'){
      commitNote(btn.closest('.note-editor'));
    }else if(action === 'note-cancel'){
      state.editingNote = null;
      render();
    }
  });

  listEl.addEventListener('keydown', function(e){
    const inp = e.target;
    if(!inp.classList || !inp.classList.contains('note-input')) return;
    if(e.key === 'Enter'){
      e.preventDefault();
      commitNote(inp.closest('.note-editor'));
    }else if(e.key === 'Escape'){
      e.preventDefault();
      state.editingNote = null;
      render();
    }
  });

  /* ---------------- 顶部按钮 ---------------- */
  document.getElementById('btnAdd').addEventListener('click', () => setPanel('add'));
  document.getElementById('btnCategory').addEventListener('click', () => setPanel('category'));
  document.getElementById('btnSync').addEventListener('click', () => setPanel('sync'));
  document.getElementById('btnSettings').addEventListener('click', () => setPanel('settings'));
  document.getElementById('btnRefresh').addEventListener('click', refreshAll);

  /* ---------------- 分类管理区 ---------------- */
  const chipsEl = document.getElementById('categoryChips');
  const catAddRow = document.getElementById('catAddRow');
  const catNewName = document.getElementById('catNewName');

  chipsEl.addEventListener('click', function(e){
    const del = e.target.closest('[data-cat-del]');
    if(del){
      e.stopPropagation();
      deleteCategory(del.dataset.catDel);
    }
  });

  document.getElementById('addCategoryBtn').addEventListener('click', function(){
    catAddRow.style.display = 'flex';
    catNewName.value = '';
    try{ catNewName.focus(); }catch(e){}
  });

  document.getElementById('catAddCancel').addEventListener('click', function(){
    catAddRow.style.display = 'none';
    catNewName.value = '';
  });

  function confirmAddCategory(){
    const ok = addCategory(catNewName.value);
    if(ok){
      catAddRow.style.display = 'none';
      catNewName.value = '';
    }
  }

  document.getElementById('catAddConfirm').addEventListener('click', confirmAddCategory);
  catNewName.addEventListener('keydown', function(e){
    if(e.key === 'Enter'){ e.preventDefault(); confirmAddCategory(); }
    else if(e.key === 'Escape'){ e.preventDefault(); catAddRow.style.display = 'none'; catNewName.value = ''; }
  });

  /* ---------------- 批量分类 ---------------- */
  const bulkListEl = document.getElementById('bulkList');

  bulkListEl.addEventListener('change', function(e){
    const cb = e.target;
    if(!cb.matches || !cb.matches('input[type=checkbox][data-bulk-name]')) return;
    const name = cb.dataset.bulkName;
    if(cb.checked) state.bulkSelected[name] = true;
    else delete state.bulkSelected[name];
    document.getElementById('bulkCount').textContent =
      String(Object.keys(state.bulkSelected).filter(k => state.bulkSelected[k]).length);
  });

  document.getElementById('bulkSelectAll').addEventListener('click', function(){
    state.repos.forEach(r => { state.bulkSelected[r.fullName] = true; });
    renderBulk();
  });
  document.getElementById('bulkSelectNone').addEventListener('click', function(){
    state.bulkSelected = {};
    renderBulk();
  });
  document.getElementById('bulkApply').addEventListener('click', function(){
    const names = Object.keys(state.bulkSelected).filter(k => state.bulkSelected[k]);
    if(!names.length){ toast('请先勾选要修改的仓库'); return; }
    const target = document.getElementById('bulkCategorySel').value || '';
    let changed = 0;
    state.repos.forEach(r => {
      if(names.indexOf(r.fullName) >= 0){
        if(r.category !== target){
          r.category = target;
          changed++;
        }
      }
    });
    if(!changed){ toast('所选仓库已经是该分类了'); return; }
    save(); render();
    toast(target
      ? `已把 ${changed} 个仓库归入「${target}」`
      : `已把 ${changed} 个仓库移到「未分类」`);
  });

  /* ---------------- 列表工具栏 ---------------- */
  document.getElementById('markAllRead').addEventListener('click', function(){
    let n = 0;
    state.repos.forEach(r => {
      if(r.isNew){
        r.isNew = false;
        r.isRollback = false;
        r.previousTag = null;
        if(r.latest) r.lastSeenTag = r.latest.tag;
        n++;
      }
    });
    save(); render(); updateTitle();
    toast(n ? `已标记 ${n} 个仓库为已读` : '没有未读的新版本');
  });

  document.getElementById('filterCategory').addEventListener('change', function(){
    state.filterCategory = this.value || '__all__';
    render();
  });

  document.getElementById('includePrerelease').addEventListener('change', function(){
    state.includePrerelease = this.checked;
    state.repos.forEach(r => {
      r.lastSeenTag = null; r.isNew = false; r.isRollback = false;
      r.previousTag = null;
    });
    save();
    if(state.repos.length) refreshAll();
    toast(this.checked ? '已包含预发布版本（基线已重置）' : '已只看正式版本（基线已重置）');
  });

  document.getElementById('autoRefresh').addEventListener('change', function(){
    state.autoRefreshMinutes = Number(this.value) || 0;
    save();
    setupTimer();
    toast(state.autoRefreshMinutes ? `已开启自动刷新：每 ${state.autoRefreshMinutes} 分钟` : '已关闭自动刷新');
  });

  /* -------- Token 输入 -------- */
  const tokenEl = document.getElementById('tokenInput');
  tokenEl.addEventListener('input', function(){
    state.token = this.value.trim().replace(/[^\x21-\x7E]/g, '');
  });
  tokenEl.addEventListener('change', function(){
    const t = this.value.trim().replace(/[^\x21-\x7E]/g, '');
    this.value = t;
    state.token = t;
    save();
    if(t && !/^(gh[pousr]_|github_pat_)/.test(t)){
      toast('Token 格式看起来不对，应以 ghp_ 或 github_pat_ 开头');
    }else{
      toast(t ? 'Token 已保存，正在刷新…' : 'Token 已清空');
    }
    if(state.repos.length) refreshAll();
  });

  document.getElementById('gistInput').addEventListener('change', function(){
    state.gistId = this.value.trim();
    save({ touch:false });
    setSyncStatus('', state.gistId ? '已绑定 ' + state.gistId.slice(0,8) + '…' : '');
  });

  document.getElementById('gistCreate').addEventListener('click', createGist);
  document.getElementById('gistPull').addEventListener('click', () => cloudPull(false));
  document.getElementById('gistPush').addEventListener('click', () => {
    if(!state.repos.length && state.gistId){
      if(!confirm('本地列表为空，推送会用空数据覆盖云端，确定继续？')) return;
    }
    cloudPush(false);
  });

  /* ---------------- 定时器 ---------------- */
  let timer = null;
  function setupTimer(){
    clearInterval(timer);
    if(state.autoRefreshMinutes > 0){
      timer = setInterval(refreshAll, state.autoRefreshMinutes * 60000);
    }
  }

  /* ---------------- URL 快速配置 ---------------- */
  function applyUrlConfig(){
    const h = location.hash.replace(/^#/, '');
    if(!h) return;
    let p;
    try{ p = new URLSearchParams(h); }catch(e){ return; }
    const g = p.get('gist'), t = p.get('token');
    if(g) state.gistId = g;
    if(t) state.token = t.replace(/[^\x21-\x7E]/g, '');
    if(g || t){
      try{ history.replaceState(null, '', location.pathname + location.search); }catch(e){}
      save({ touch:false, push:false });
    }
  }

  /* ---------------- 启动 ---------------- */
  async function init(){
    load();
    applyUrlConfig();

    document.getElementById('includePrerelease').checked = state.includePrerelease;
    document.getElementById('autoRefresh').value = String(state.autoRefreshMinutes);
    document.getElementById('tokenInput').value = state.token;
    document.getElementById('gistInput').value = state.gistId;

    render();
    updateTitle();
    setupTimer();

    if(state.gistId && currentToken()){
      setSyncStatus('busy', '⏳ 正在拉取云端数据…');
      const r = await cloudPull(true);
      if(!r.ok) setSyncStatus('err', '⚠ ' + (r.error || '拉取失败'));
      render(); updateTitle();
    }else if(state.gistId && !currentToken()){
      setSyncStatus('', '已绑定 Gist，填入 Token 后自动同步');
    }

    ensureCloudHasData();

    if(state.repos.length){
      setTimeout(refreshAll, 300);
    }
  }

  init();
})();
</script>
</body>
</html>
